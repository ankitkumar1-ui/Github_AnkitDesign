<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>ADX · Onboarding</title>
<link rel="icon" href="assets/adx-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Every font any screen uses -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@500;600&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shadcn.css">
<link rel="stylesheet" href="shadcn-app.css">
<style>
  html { color-scheme: light; }
  html, body { margin: 0; background: #fafafa; }
  #jump { position: fixed; left: 12px; bottom: 12px; z-index: 9999; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100vw - 72px);
          padding: 5px; border-radius: 12px; background: rgba(24,24,27,.86); backdrop-filter: blur(8px); font: 500 11.5px/1 Inter, system-ui, sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  #jump a { color: #d4d4d8; text-decoration: none; padding: 6px 9px; border-radius: 8px; }
  #jump a:hover { background: rgba(255,255,255,.08); color: #fff; }
  #jump a.on { background: #fff; color: #18181b; }
  #jump .sep { width: 1px; align-self: stretch; margin: 4px 3px; background: rgba(255,255,255,.14); }
  #jump .jx { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; cursor: pointer; color: #a1a1aa; font: inherit; padding: 6px 7px; border-radius: 8px; }
  #jump .jx:hover { background: rgba(255,255,255,.08); color: #fff; }
  #jump.min .jx { color: #d4d4d8; padding: 6px 8px 6px 10px; }
  #jump.hide, #reset.hide { display: none; }
  #reset { position: fixed; right: 12px; bottom: 12px; z-index: 9999; width: 36px; height: 36px; border: 0; border-radius: 50%; cursor: pointer;
           display: flex; align-items: center; justify-content: center; color: #d4d4d8; background: rgba(24,24,27,.86); backdrop-filter: blur(8px); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  #reset:hover { color: #fff; background: rgba(24,24,27,.95); }
  /* version switcher: a pill above Reset that grows into a flyout */
  #ver { position: fixed; right: 12px; bottom: 56px; z-index: 9999; font: 500 12px/1 Inter, system-ui, sans-serif; }
  #ver.hide { display: none; }
  #ver .vb { width: 36px; height: 36px; border: 0; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
             font: 600 11.5px/1 Inter, system-ui, sans-serif; letter-spacing: .02em; color: #d4d4d8; background: rgba(24,24,27,.86); backdrop-filter: blur(8px); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  #ver .vb:hover, #ver.open .vb { color: #fff; background: rgba(24,24,27,.95); }
  #ver .vf { position: absolute; right: 0; bottom: 44px; width: 232px; padding: 6px; border-radius: 14px; background: rgba(24,24,27,.94); backdrop-filter: blur(10px);
             box-shadow: 0 16px 40px rgba(0,0,0,.28); transform-origin: bottom right; transform: scale(.4); opacity: 0; pointer-events: none;
             transition: transform .18s cubic-bezier(.2,.8,.2,1), opacity .14s ease; }
  #ver.open .vf { transform: none; opacity: 1; pointer-events: auto; }
  #ver .vt { padding: 8px 10px 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #71717a; }
  #ver .vi { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 9px; background: none; cursor: pointer; text-align: left; color: #d4d4d8; font: inherit; }
  #ver .vi:hover { background: rgba(255,255,255,.08); color: #fff; }
  #ver .vi b { flex: 0 0 26px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; background: rgba(255,255,255,.1); color: #fff; }
  #ver .vi.on b { background: #fff; color: #18181b; }
  #ver .vi span { flex: 1; display: flex; flex-direction: column; gap: 3px; line-height: 1.2; }
  #ver .vi em { font-style: normal; font-size: 11px; color: #a1a1aa; }
  #ver .vi svg { color: #fff; opacity: 0; }
  #ver .vi.on svg { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #ver .vf { transition: none; } }
</style>
<style id="screen-style"></style>
</head>
<body>
<div id="app"></div>
<nav id="jump" aria-label="Prototype screens"></nav>
<div id="ver"></div>
<button id="reset" type="button" title="Reset this screen and the demo state" aria-label="Reset this screen and the demo state"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></button>
<script src="runtime.js"></script>
<script src="shadcn-select.js"></script>
<script src="app.js"></script>
</body>
</html>
