.scan-tip b{display:block;font-weight:600}
.scan-tip span{color:#a1a1aa}

/* section headings and the snap between "Auto-scan" and "Add connections manually" */
.ob-sh h2{margin:0;font-size:19px;line-height:1.25;font-weight:600;letter-spacing:-0.015em;color:#09090b}
.ob-sh h2 span{font-family:'Geist Mono',ui-monospace,monospace;font-size:16px;font-weight:500;color:#2f7a70;background:rgba(60,140,129,.1);border-radius:6px;padding:1px 7px;margin-left:4px}
.ob-sh p{margin:5px 0 0;font-size:13.5px;line-height:1.5;color:#71717a}
.ob-pg2{display:flex;flex-direction:column;gap:18px;margin-top:44px;padding-top:28px;border-top:1px solid #e4e4e7;scroll-margin-top:12px}
.ob-cue{align-self:center;display:inline-flex;align-items:center;gap:6px;margin-top:-4px;border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:600;color:#71717a;cursor:pointer;padding:6px 10px;border-radius:8px}
.ob-cue:hover{color:#09090b;background:#f4f4f5}
.ob-cue svg{animation:obCue 1.6s ease-in-out infinite}
@keyframes obCue{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.scan-hero{height:max(400px,calc(100vh - 360px))}
@media (prefers-reduced-motion:reduce){.ob-cue svg{animation:none}}
@keyframes scanHeroIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes scanCollapse{from{opacity:0;transform:scaleY(1.6);transform-origin:top}to{opacity:1;transform:none}}
@keyframes scanPing{0%{box-shadow:0 0 0 0 rgba(95,211,194,.6)}80%,100%{box-shadow:0 0 0 8px rgba(95,211,194,0)}}
@media (max-width:620px){.scan-hero{height:480px}.scan-grad{background:linear-gradient(to bottom,rgba(9,9,11,.72) 0%,rgba(9,9,11,.32) 12%,rgba(9,9,11,0) 26%),linear-gradient(to top,#09090b 0%,rgba(9,9,11,.92) 50%,rgba(9,9,11,.35) 72%,rgba(9,9,11,0) 86%)}.scan-cta{padding:0 18px 22px}.scan-cta h2{font-size:21px}.scan-btns{flex-direction:column;align-self:stretch}.scan-go,.scan-skip{justify-content:center;width:100%}}
@media (prefers-reduced-motion:reduce){.scan-hero,.scan-card{animation:none}.scan-cta .k i{animation:none}.ob-dots i{animation:none;opacity:.6}}

</style>

            <sc-if value="{{evt.noSrc}}" hint-placeholder-val="{{true}}">
