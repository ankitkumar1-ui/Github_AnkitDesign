<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding — Connect your data</title>
<!-- Styles for this screen only (added while the screen is shown). Fonts are loaded once in index.html. -->
<style>

body{margin:0}
/* ---- Auto-scan: the first choice in each Connect tab ---- */
.so-ic{flex:0 0 36px;width:36px;height:36px;box-sizing:border-box;border-radius:9px;background:#fff;border:1px solid #e4e4e7;color:#09090b;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center}
.so-body{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:4px}
.so-act{flex:0 0 auto;display:flex;align-items:center;gap:8px}

/* section heading */
.ob-sh h2{margin:0;font-size:16px;line-height:1.25;font-weight:600;letter-spacing:-0.015em;color:#09090b}
.ob-sh p{margin:5px 0 0;font-size:13px;line-height:1.5;color:#71717a}

</style>
</head>
<body>
<!-- Markup: Claude Design "DC" template syntax. See CLAUDE.md for the rules. -->
<template data-view>
<div style="min-height: 100vh; background: #fafafa; font-family: Geist, ui-sans-serif, system-ui, -apple-system, sans-serif; color: #09090b; -webkit-font-smoothing: antialiased">

  <header style="position: relative; min-height: 72px; display: flex; align-items: center; justify-content: center; padding: 16px 76px; box-sizing: border-box">
    <div title="Cortex" style="position: absolute; left: 20px; top: 16px; width: 40px; height: 40px; border-radius: 11px; background: #3c8c81; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(60,140,129,0.35)">
      <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path d="M24 7C25 16 32 23 41 24C32 25 25 32 24 41C23 32 16 25 7 24C16 23 23 16 24 7Z" fill="#fff"></path></svg>
    </div>
    <nav aria-label="Onboarding steps" style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center">
      <a href="#/about" style="display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; color: #3f3f46; text-decoration: none"><span style="width: 16px; height: 16px; border-radius: 50%; background: #16a34a; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>About you</a>
      <span aria-hidden="true" style="color: #d4d4d8; letter-spacing: 3px; font-size: 12px">···</span>
      <span aria-current="step" style="display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; background: #18181b; color: #fff; box-shadow: 0 4px 14px rgba(24,24,27,0.3)"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg>Connect your data<span aria-hidden="true" style="display: inline-flex; align-items: center; margin-left: 2px"><span style="box-sizing: border-box; width: 20px; height: 20px; border-radius: 6px; border: 2px solid #18181b; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 8px; font-weight: 800; letter-spacing: -0.03em; background: #E2412E; z-index: 3" title="Adobe Analytics">Ad</span><span style="box-sizing: border-box; width: 20px; height: 20px; border-radius: 6px; border: 2px solid #18181b; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 8px; font-weight: 800; letter-spacing: -0.03em; background: #E37400; margin-left: -6px; z-index: 2" title="Google Analytics"><svg width="10" height="10" viewBox="0 0 12 12"><rect x="1" y="6" width="2.6" height="5" rx="1.2" fill="#fff"></rect><rect x="4.7" y="3.5" width="2.6" height="7.5" rx="1.2" fill="#fff"></rect><rect x="8.4" y="1" width="2.6" height="10" rx="1.3" fill="#fff"></rect></svg></span><span style="box-sizing: border-box; width: 20px; height: 20px; border-radius: 6px; border: 2px solid #18181b; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 8px; font-weight: 800; letter-spacing: -0.03em; background: #2C6BB3; margin-left: -6px; z-index: 1" title="Tealium">Tl</span></span></span>
      <span aria-hidden="true" style="color: #d4d4d8; letter-spacing: 3px; font-size: 12px">···</span>
      <span style="display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; color: #71717a"><span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #d4d4d8; font-size: 11px; display: flex; align-items: center; justify-content: center">3</span>Your goals</span>
    </nav>
    <div class="shav" style="position: absolute; right: 20px; top: 20px" title="emma.clarke@sephora.com">EC</div>
  </header>

  <main style="max-width: 820px; margin: 0 auto; padding: 36px 24px 110px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; gap: 16px; align-items: flex-start; margin-bottom: 4px">
      <span aria-hidden="true" style="flex: 0 0 44px; width: 44px; height: 44px; border-radius: 12px; background: #f4f4f5; color: #18181b; border: 1px solid #e4e4e7; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"></path></svg></span>
      <div style="min-width: 0; flex: 1">
      <h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em">Connect your data</h1>
      <p style="margin: 6px 0 0; font-size: 14px; line-height: 1.5; color: #71717a">Let Cortex scan sephora.com to learn how your site works, or connect the services Sephora already uses for web signals, product catalog and content. Cortex reads them and drafts a first set of signals. Everything is read-only.</p>
      </div>
    </div>

    <div id="obManual" style="display: flex; flex-direction: column; gap: 18px">
    <div style="margin: 0 2px -6px">
      <div style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em">Add context</div>
      <div style="font-size: 14px; color: #71717a; margin-top: 2px">Web signals, a product catalog and content are required. The rest is optional.</div>
    </div>

    <!-- ============ 1 · ANALYTICS ============ -->
    <section class="shcard" style="overflow: hidden">
      <button type="button" onClick="{{evt.toggle}}" aria-expanded="{{evt.exp}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 18px 22px; border: 0; background: transparent; font-family: inherit; color: inherit; text-align: left; cursor: pointer">
        <span style="position: relative; flex: 0 0 36px; width: 36px; height: 36px; border-radius: 10px; background: rgba(60,140,129,0.12); color: #2f7369; display: flex; align-items: center; justify-content: center">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"></path></svg><sc-if value="{{evt.secDone}}" hint-placeholder-val="{{false}}"><span title="{{evt.tickTitle}}" style="position: absolute; bottom: -5px; right: -5px; width: 16px; height: 16px; border-radius: 50%; background: #16a34a; color: #fff; box-shadow: 0 0 0 2px #fff; display: flex; align-items: center; justify-content: center"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span></sc-if></span>
        <div style="flex: 1; min-width: 0">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em">Web signals
            <span class="shbadge sec">Required</span></div>
          <div style="font-size: 14px; color: {{evt.subFg}}; margin-top: 2px">{{evt.sub}}</div>
        </div>
        <sc-if value="{{evt.hasFaces}}" hint-placeholder-val="{{false}}"><span title="{{evt.facesTitle}}" style="display: inline-flex; align-items: center; flex: 0 0 auto"><sc-for list="{{evt.faces}}" as="f" hint-placeholder-count="3"><span style="position: relative; z-index: {{f.z}}; margin-left: {{f.ml}}; width: 26px; height: 26px; box-sizing: border-box; border-radius: 8px; background: #fff; border: 1px solid #e4e4e7; box-shadow: 0 0 0 2px #fff; display: flex; align-items: center; justify-content: center"><img src="{{f.logo}}" alt="" width="15" height="15" style="display: block; border-radius: 3px"></span></sc-for><sc-if value="{{evt.more}}" hint-placeholder-val="{{false}}"><span style="position: relative; margin-left: -8px; height: 26px; min-width: 26px; padding: 0 6px; box-sizing: border-box; border-radius: 8px; background: #f4f4f5; border: 1px solid #e4e4e7; box-shadow: 0 0 0 2px #fff; font-size: 12px; font-weight: 600; color: #3f3f46; display: flex; align-items: center; justify-content: center">{{evt.more}}</span></sc-if></span></sc-if>
        <sc-if value="{{evt.showText}}" hint-placeholder-val="{{true}}">
        <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; color: {{evt.stFg}}; font-weight: {{evt.stWeight}}">
          <sc-if value="{{evt.ok}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>{{evt.stText}}</span></sc-if>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; transform: rotate({{evt.rot}}); transition: transform 0.15s"><path d="m6 9 6 6 6-6"></path></svg>
      </button>

      <sc-if value="{{evt.open}}" hint-placeholder-val="{{true}}">
      <div style="padding: 0 22px 22px; display: flex; flex-direction: column; gap: 16px">
        <div role="tablist" aria-label="How to bring in analytics data" class="shtabs">
          <sc-for list="{{evt.modes}}" as="s" hint-placeholder-count="3">
            <button type="button" role="tab" aria-selected="{{s.sel}}" onClick="{{s.pick}}" class="shtab">{{s.label}}</button>
          </sc-for>
        </div>

        <!-- CONNECT -->
        <sc-if value="{{evt.isConnect}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; gap: 14px">
            <sc-if value="{{evt.scanTile.show}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
            <div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
                <b style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em">1. Auto-scan</b>
                <sc-if value="{{evt.scanTile.idle}}" hint-placeholder-val="{{true}}"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>3–5 min</span></sc-if>
              </div>
              <sc-if value="{{evt.scanTile.idle}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-size: 14px; line-height: 1.5; color: #71717a; text-wrap: pretty">{{evt.scanTile.desc}}</p></sc-if>
              <sc-if value="{{evt.scanTile.running}}" hint-placeholder-val="{{false}}">
                <div role="status" style="display: flex; flex-direction: column; gap: 7px; max-width: 520px">
                  <div style="display: flex; align-items: baseline; gap: 10px; font-size: 14px"><span style="flex: 1; min-width: 0; color: #3f3f46">{{evt.scanTile.phase}}</span><span style="font-size: 12px; color: #52525b; white-space: nowrap">{{evt.scanTile.pct}}% · {{evt.scanTile.left}}</span></div>
                  <div class="shprog"><i style="width: {{evt.scanTile.pctW}}"></i></div>
                </div>
              </sc-if>
              <sc-if value="{{evt.scanTile.done}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #15803d"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 18px; margin-left: 2px"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>{{evt.scanTile.result}}</div>
                <div style="font-size: 12px; color: #71717a">{{evt.scanTile.pages}} pages scanned · {{evt.scanTile.when}} · public pages only</div>
              </sc-if>
            </div>
            <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 12px"><span class="so-ic" aria-hidden="true"><img src="assets/logos/sephora.com.png" alt="" width="30" height="30" style="display: block; filter: invert(1)"></span><div style="display: flex; align-items: center; gap: 8px">
                <sc-if value="{{evt.scanTile.idle}}" hint-placeholder-val="{{true}}"><button type="button" class="shb pri" onClick="{{evt.scanTile.start}}">Allow scan</button></sc-if>
                <sc-if value="{{evt.scanTile.running}}" hint-placeholder-val="{{false}}"><button type="button" class="shb out" disabled><svg class="shspin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>Scanning…</button></sc-if>
                <sc-if value="{{evt.scanTile.done}}" hint-placeholder-val="{{false}}">
                  <sc-if value="{{evt.scanTile.hasView}}" hint-placeholder-val="{{false}}"><a class="shb pri" href="{{evt.scanTile.viewHref}}">{{evt.scanTile.viewLabel}}</a></sc-if>
                  <button type="button" class="shb out" onClick="{{evt.scanTile.rescan}}">Rescan</button>
                </sc-if>
              </div></div>
          </div>
          <div style="border-top: 1px solid #e4e4e7; margin-top: 2px"></div>
          <b style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: -4px">2. Connect apps manually</b>
        </sc-if>
            <sc-if value="{{showFound}}" hint-placeholder-val="{{false}}">
            <div class="shalert" style="align-items: center">
              <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true" style="flex: 0 0 auto"><path d="M24 7C25 16 32 23 41 24C32 25 25 32 24 41C23 32 16 25 7 24C16 23 23 16 24 7Z" fill="#3c8c81"></path></svg>
              <span style="flex: 1; min-width: 0; font-size: 14px; line-height: 1.45; color: #3f3f46">Found <b style="font-weight: 600; color: #09090b">Adobe Analytics</b> and <b style="font-weight: 600; color: #09090b">Tealium iQ</b> on sephora.com.</span>
            </div>
            </sc-if>

            <div role="radiogroup" aria-label="Web signals source" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 8px">
              <sc-for list="{{evt.tiles}}" as="t" hint-placeholder-count="9">
                <button type="button" role="radio" aria-checked="{{t.sel}}" onClick="{{t.pick}}" style="position: relative; display: flex; align-items: center; gap: 9px; min-width: 0; min-height: 52px; box-sizing: border-box; text-align: left; border: 1px solid {{t.bd}}; box-shadow: {{t.ring}}; border-radius: 10px; padding: 7px 10px; background: #fff; font-family: inherit; color: inherit; cursor: pointer">
                  <span style="flex: 0 0 34px; width: 34px; height: 34px; box-sizing: border-box; border-radius: 9px; border: 1px solid #f0f0f2; background: #fff; display: flex; align-items: center; justify-content: center"><img src="{{t.logo}}" alt="" width="20" height="20" style="display: block; border-radius: 3px"></span>
                  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
                    <b title="{{t.name}}" style="font-size: 12px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</b>
                    <sc-if value="{{t.detected}}" hint-placeholder-val="{{false}}"><span class="shbadge sec" style="margin-top: 2px; padding: 0 6px; align-self: flex-start; display: block; max-width: 100%; box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">On your site</span></sc-if>
                  </span>
                  
                  <sc-if value="{{t.running}}" hint-placeholder-val="{{false}}">
                    <span title="Connecting" aria-label="Connecting" style="display: flex"><svg class="shspin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></span>
                  </sc-if>
                  <sc-if value="{{t.on}}" hint-placeholder-val="{{false}}"><span title="Connected" style="position: absolute; bottom: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; background: #16a34a; color: #fff; box-shadow: 0 0 0 2px #fff; display: flex; align-items: center; justify-content: center"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span></sc-if>
                </button>
              </sc-for>
            </div>
          <sc-if value="{{evt.hasMore}}" hint-placeholder-val="{{false}}"><button type="button" class="shb ghost" onClick="{{evt.toggleMore}}" style="align-self: flex-start; height: 28px; padding: 0 8px; margin-left: -8px; font-size: 12px; gap: 6px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{evt.moreRot}})"><path d="m6 9 6 6 6-6"></path></svg>{{evt.moreLabel}}<sc-if value="{{evt.hasPeek}}" hint-placeholder-val="{{false}}"><span title="{{evt.peekTitle}}" style="display: inline-flex; align-items: center; margin-left: 2px"><sc-for list="{{evt.peek}}" as="f" hint-placeholder-count="3"><span style="position: relative; z-index: {{f.z}}; margin-left: {{f.ml}}; width: 22px; height: 22px; box-sizing: border-box; border-radius: 6px; background: #fff; border: 1px solid #e4e4e7; box-shadow: 0 0 0 2px #fff; display: flex; align-items: center; justify-content: center"><img src="{{f.logo}}" alt="" width="14" height="14" style="display: block; border-radius: 2px"></span></sc-for><sc-if value="{{evt.peekMore}}" hint-placeholder-val="{{false}}"><span style="position: relative; margin-left: -3px; height: 22px; min-width: 22px; padding: 0 5px; box-sizing: border-box; border-radius: 6px; background: #f4f4f5; border: 1px solid #e4e4e7; box-shadow: 0 0 0 2px #fff; font-size: 12px; font-weight: 500; color: #3f3f46; display: flex; align-items: center; justify-content: center">{{evt.peekMore}}</span></sc-if></span></sc-if></button></sc-if>

            <sc-if value="{{evt.hasSrc}}" hint-placeholder-val="{{false}}">
            <div class="shdlg-back" onClick="{{evt.closeSrc}}">
<div class="shdlg" role="dialog" aria-modal="true" onClick="{{evt.stop}}">
<button type="button" class="shdlg-x" onClick="{{evt.closeSrc}}" aria-label="Close"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
              <div style="display: flex; align-items: center; gap: 13px; flex-wrap: wrap">
                <span style="flex: 0 0 40px; width: 40px; height: 40px; box-sizing: border-box; border-radius: 11px; border: 1px solid #e4e4e7; background: #fff; display: flex; align-items: center; justify-content: center"><img src="{{evt.logo}}" alt="" width="22" height="22" style="display: block; border-radius: 4px"></span>
                <span style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                  <b style="font-size: 14px; font-weight: 600">{{evt.name}}</b>
                  <span style="font-size: 12px; color: #71717a">{{evt.desc}}</span>
                </span>
                <sc-if value="{{evt.done}}" hint-placeholder-val="{{false}}">
                  <span class="shbadge out" style=""><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>Connected</span>
                  <button type="button" class="shb out sm"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"></path></svg>Refresh</button>
                  <button type="button" onClick="{{evt.reset}}" class="shb out sm">Disconnect</button>
                </sc-if>
              </div>

              <sc-if value="{{evt.form}}" hint-placeholder-val="{{true}}">
                <div style="display: flex; flex-direction: column; gap: 14px">
                  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 12px">
                    <sc-for list="{{evt.fields}}" as="f" hint-placeholder-count="5">
                      <label class="shl" style="flex-direction: column; align-items: stretch; gap: 8px; line-height: 1.4">
                        <span>{{f.label}} <span style="font-weight: 400; color: #71717a">{{f.hint}}</span></span>
                        <input class="shi" type="{{f.type}}" value="{{f.val}}" onInput="{{f.set}}" placeholder="{{f.ph}}">
                      </label>
                    </sc-for>
                  </div>
                  <div class="shalert">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 2px; color: #71717a"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
                    <span>{{evt.note}}</span>
                  </div>
                  <div style="display: flex; align-items: center; gap: 12px">
                    <button type="button" class="shb pri" onClick="{{evt.start}}">Connect</button><button type="button" class="shb out" onClick="{{evt.closeSrc}}">Cancel</button>

<script type="text/x-dc">
/* ---------- Auto-scan sephora.com, one scan per section ----------
   Web signals, Product catalog and Content each scan for their own thing, so each has its own run:
   window.ADX_SCAN.scans[kind] = { st: 'idle' | 'running' | 'done', t0, done }, kind = 'evt' | 'cat' | 'cms'.
   One shared ticker (window.ADX_SCAN.timer) advances every running scan and sends each its own toast,
   whichever screen is open. */
var SCAN_SITE = 'sephora.com', SCAN_MS = 75000;
var SCAN_FOUND = { pages: 120, events: 142, signals: 23, products: 12480, content: 1240 };
// per kind: phase copy, a running count, the finished toast and where it links
var SCAN_KIND = {
  evt: { phases: ['Opening ' + SCAN_SITE + '…', 'Reading pages', 'Matching events to signals', 'Drafting signals'],
    count: function (p) { return Math.round(SCAN_FOUND.events * p) + ' events found'; },
    toast: ['Web signals scan complete', SCAN_FOUND.events + ' events · ' + SCAN_FOUND.signals + ' signals drafted', '#/signals', 'View signals'] },
  cat: { phases: ['Opening ' + SCAN_SITE + '…', 'Reading product pages', 'Matching products and prices', 'Building the catalog'],
    count: function (p) { return Math.round(SCAN_FOUND.products * p).toLocaleString('en-US') + ' products found'; },
    toast: ['Product catalog scan complete', SCAN_FOUND.products.toLocaleString('en-US') + ' products', '#/catalog', 'View catalog'] },
  cms: { phases: ['Opening ' + SCAN_SITE + '…', 'Reading guides and banners', 'Indexing content', 'Building the library'],
    count: function (p) { return Math.round(SCAN_FOUND.content * p).toLocaleString('en-US') + ' pages found'; },
    toast: ['Content scan complete', SCAN_FOUND.content.toLocaleString('en-US') + ' pages, guides and banners', null, null] }
};
function scanStore() {
  var S = window.ADX_SCAN || (window.ADX_SCAN = { subs: [] });
  if (!S.scans) S.scans = { evt: { st: 'idle' }, cat: { st: 'idle' }, cms: { st: 'idle' } };
  return S;
}
function scanOf(kind) { return scanStore().scans[kind]; }
function scanPct(x) { return x.st === 'done' ? 1 : x.st === 'running' ? Math.min(1, Math.max(0, (Date.now() - x.t0) / SCAN_MS)) : 0; }
function scanPhase(p, kind) {
  var ph = SCAN_KIND[kind].phases;
  return p < 0.2 ? ph[0] : p < 0.6 ? ph[1] + ' · ' + Math.round(SCAN_FOUND.pages * p) + ' of ' + SCAN_FOUND.pages : p < 0.9 ? ph[2] : ph[3];
}
function scanLeft(p) {
  var s = SCAN_MS * (1 - p) / 1000;
  return s < 10 ? 'less than 10s left' : s >= 60 ? 'about 1 min left' : 'about ' + Math.round(s / 5) * 5 + 's left';
}
function scanNotify() { var S = scanStore(); S.subs.slice().forEach(function (f) { try { f(); } catch (e) {} }); }
function scanTick() {
  var S = scanStore(), any = false;
  Object.keys(S.scans).forEach(function (k) {
    var x = S.scans[k];
    if (x.st === 'running' && Date.now() - x.t0 >= SCAN_MS) { x.st = 'done'; x.done = Date.now(); scanToast(k); }
    if (x.st === 'running') any = true;
  });
  scanNotify();
  if (!any) { clearInterval(S.timer); S.timer = 0; }
}
function scanStart(kind) {
  var S = scanStore(), x = S.scans[kind];
  x.st = 'running'; x.t0 = Date.now(); x.done = 0;
  if (!S.timer) S.timer = setInterval(scanTick, 500);
  scanNotify();
}
// toast with inline styles: the screen's <style> is swapped out when another screen is shown
function scanToast(kind) {
  var T = SCAN_KIND[kind].toast, id = 'adxScanToast-' + kind;
  var old = document.getElementById(id); if (old) old.remove();
  var stack = document.querySelectorAll('[id^="adxScanToast-"]').length;
  var t = document.createElement('div');
