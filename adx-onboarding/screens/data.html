<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding — Connect your data</title>
<!-- Styles for this screen only (added while the screen is shown). Fonts are loaded once in index.html. -->
<style>

body{margin:0}
@keyframes obSpin{to{transform:rotate(360deg)}}
input::placeholder{color:#a1a1aa}

</style>
</head>
<body>
<!-- Markup: Claude Design "DC" template syntax. See CLAUDE.md for the rules. -->
<template data-view>
<div style="min-height: 100vh; background: #fafafa; font-family: Geist, ui-sans-serif, system-ui, -apple-system, sans-serif; color: #09090b; -webkit-font-smoothing: antialiased">

  <header style="position: relative; min-height: 72px; display: flex; align-items: center; justify-content: center; padding: 16px 76px; box-sizing: border-box">
    <div title="Cortex" style="position: absolute; left: 20px; top: 16px; width: 40px; height: 40px; border-radius: 11px; background: #3c8c81; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(60,140,129,0.35)">
      <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path d="M24 7C25 16 32 23 41 24C32 25 25 32 24 41C23 32 16 25 7 24C16 23 23 16 24 7Z" fill="#fff"></path></svg>
    </div>
    <nav aria-label="Onboarding steps" style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center">
      <a href="#/about" style="display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; color: #3f3f46; text-decoration: none"><span style="width: 16px; height: 16px; border-radius: 50%; background: #16a34a; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>About you</a>
      <span aria-hidden="true" style="color: #d4d4d8; letter-spacing: 3px; font-size: 12px">···</span>
      <span aria-current="step" style="display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; background: #18181b; color: #fff; box-shadow: 0 4px 14px rgba(24,24,27,0.3)"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg>Connect your data<span aria-hidden="true" style="display: inline-flex; align-items: center; margin-left: 2px"><span style="box-sizing: border-box; width: 20px; height: 20px; border-radius: 6px; border: 2px solid #18181b; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 8px; font-weight: 800; letter-spacing: -0.03em; background: #E2412E; z-index: 3" title="Adobe Analytics">Ad</span><span style="box-sizing: border-box; width: 20px; height: 20px; border-radius: 6px; border: 2px solid #18181b; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 8px; font-weight: 800; letter-spacing: -0.03em; background: #E37400; margin-left: -6px; z-index: 2" title="Google Analytics"><svg width="10" height="10" viewBox="0 0 12 12"><rect x="1" y="6" width="2.6" height="5" rx="1.2" fill="#fff"></rect><rect x="4.7" y="3.5" width="2.6" height="7.5" rx="1.2" fill="#fff"></rect><rect x="8.4" y="1" width="2.6" height="10" rx="1.3" fill="#fff"></rect></svg></span><span style="box-sizing: border-box; width: 20px; height: 20px; border-radius: 6px; border: 2px solid #18181b; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 8px; font-weight: 800; letter-spacing: -0.03em; background: #2C6BB3; margin-left: -6px; z-index: 1" title="Tealium">Tl</span></span></span>
      <span aria-hidden="true" style="color: #d4d4d8; letter-spacing: 3px; font-size: 12px">···</span>
      <span style="display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; color: #71717a"><span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #d4d4d8; font-size: 11px; display: flex; align-items: center; justify-content: center">3</span>Your goals</span>
    </nav>
    <div style="position: absolute; right: 20px; top: 20px; width: 32px; height: 32px; border-radius: 50%; background: #9bdb72; color: #1f4d14; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center" title="emma.clarke@sephora.com">EC</div>
  </header>

  <main style="max-width: 820px; margin: 0 auto; padding: 36px 24px 110px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">

    <div style="margin-bottom: 4px">
      <h1 style="margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em">Connect your data</h1>
      <p style="margin: 8px 0 0; font-size: 14.5px; line-height: 1.55; color: #71717a; max-width: 62ch">Connect your web signals and product catalog, and add more context if you have it. Cortex reads them and drafts a first set of signals. Everything is read-only.</p>
    </div>

    <!-- ============ 1 · ANALYTICS ============ -->
    <section style="border: 1px solid #e4e4e7; border-radius: 18px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.05); overflow: hidden">
      <button type="button" onClick="{{evt.toggle}}" aria-expanded="{{evt.exp}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 18px 22px; border: 0; background: transparent; font-family: inherit; color: inherit; text-align: left; cursor: pointer">
        <span style="position: relative; flex: 0 0 36px; width: 36px; height: 36px; border-radius: 10px; background: rgba(60,140,129,0.12); color: #2f7369; display: flex; align-items: center; justify-content: center">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"></path></svg><sc-if value="{{evt.done}}" hint-placeholder-val="{{false}}"><span title="Connected" style="position: absolute; top: -5px; right: -5px; width: 16px; height: 16px; border-radius: 50%; background: #16a34a; color: #fff; box-shadow: 0 0 0 2px #fff; display: flex; align-items: center; justify-content: center"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span></sc-if></span>
        <div style="flex: 1; min-width: 0">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em">Web signals
            <em style="font-style: normal; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #52525b; background: #f4f4f5; border-radius: 5px; padding: 1px 6px">Required</em></div>
          <div style="font-size: 13px; color: #71717a; margin-top: 2px">Shopper events: page views, searches, add-to-basket and checkout.</div>
        </div>
        <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; white-space: nowrap; color: {{evt.stFg}}; font-weight: {{evt.stWeight}}">
          <sc-if value="{{evt.ok}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>{{evt.stText}}</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; transform: rotate({{evt.rot}}); transition: transform 0.15s"><path d="m6 9 6 6 6-6"></path></svg>
      </button>

      <sc-if value="{{evt.open}}" hint-placeholder-val="{{true}}">
      <div style="padding: 0 22px 22px; display: flex; flex-direction: column; gap: 16px">
        <div role="tablist" aria-label="How to bring in analytics data" style="display: inline-flex; flex-wrap: wrap; align-self: flex-start; background: #f4f4f5; border: 1px solid #e4e4e7; border-radius: 10px; padding: 3px; gap: 2px">
          <sc-for list="{{evt.modes}}" as="s" hint-placeholder-count="3">
            <button type="button" role="tab" aria-selected="{{s.sel}}" onClick="{{s.pick}}" style="font-family: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 12px; border: 0; border-radius: 7px; cursor: pointer; white-space: nowrap; background: {{s.bg}}; color: {{s.fg}}; box-shadow: {{s.shadow}}">{{s.label}}</button>
          </sc-for>
        </div>

        <!-- CONNECT -->
        <sc-if value="{{evt.isConnect}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; gap: 14px">
            <div style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; border: 1px solid rgba(60,140,129,0.3); background: linear-gradient(135deg, #f1f7f6, #fff 70%)">
              <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true" style="flex: 0 0 auto"><path d="M24 7C25 16 32 23 41 24C32 25 25 32 24 41C23 32 16 25 7 24C16 23 23 16 24 7Z" fill="#3c8c81"></path></svg>
              <span style="flex: 1; min-width: 0; font-size: 13px; line-height: 1.45; color: #3f3f46"><b style="font-weight: 600; color: #09090b">We found Adobe Web SDK on sephora.com.</b> Detected alloy.js on your homepage. Not right? Choose another source.</span>
            </div>

            <div role="radiogroup" aria-label="Web signals source" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); gap: 8px">
              <sc-for list="{{evt.tiles}}" as="t" hint-placeholder-count="9">
                <button type="button" role="radio" aria-checked="{{t.sel}}" onClick="{{t.pick}}" style="display: flex; align-items: center; gap: 10px; min-width: 0; height: 52px; box-sizing: border-box; text-align: left; border: 1px solid {{t.bd}}; box-shadow: {{t.ring}}; border-radius: 10px; padding: 0 11px; background: #fff; font-family: inherit; color: inherit; cursor: pointer">
                  <span style="flex: 0 0 30px; width: 30px; height: 30px; box-sizing: border-box; border-radius: 8px; border: 1px solid #f0f0f2; background: #fff; display: flex; align-items: center; justify-content: center"><img src="{{t.logo}}" alt="" width="18" height="18" style="display: block; border-radius: 3px"></span>
                  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
                    <b style="font-size: 13px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</b>
                    <sc-if value="{{t.detected}}" hint-placeholder-val="{{false}}"><span style="font-size: 10.5px; font-weight: 600; color: #2f7a70; line-height: 1.2">Found on your site</span></sc-if>
                  </span>
                  <sc-if value="{{t.on}}" hint-placeholder-val="{{false}}">
                    <span title="Connected" style="flex: 0 0 18px; width: 18px; height: 18px; border-radius: 50%; background: #16a34a; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
                  </sc-if>
                  <sc-if value="{{t.running}}" hint-placeholder-val="{{false}}">
                    <span title="Connecting" style="flex: 0 0 auto; width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; border: 2px solid #d4d4d8; border-top-color: #18181b; animation: obSpin 0.8s linear infinite; display: block"></span>
                  </sc-if>
                </button>
              </sc-for>
            </div>

            <sc-if value="{{evt.noSrc}}" hint-placeholder-val="{{true}}">
              <div style="font-size: 12.5px; color: #71717a; padding: 2px 2px 0">Pick a source above and we'll ask for just what it needs.</div>
            </sc-if>
            <sc-if value="{{evt.hasSrc}}" hint-placeholder-val="{{false}}">
            <div style="border: 1px solid #e4e4e7; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 18px">
              <div style="display: flex; align-items: center; gap: 13px; flex-wrap: wrap">
                <span style="flex: 0 0 40px; width: 40px; height: 40px; box-sizing: border-box; border-radius: 11px; border: 1px solid #e4e4e7; background: #fff; display: flex; align-items: center; justify-content: center"><img src="{{evt.logo}}" alt="" width="22" height="22" style="display: block; border-radius: 4px"></span>
                <span style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                  <b style="font-size: 14.5px; font-weight: 600">{{evt.name}}</b>
                  <span style="font-size: 12.5px; color: #71717a">{{evt.desc}}</span>
                </span>
                <sc-if value="{{evt.done}}" hint-placeholder-val="{{false}}">
                  <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: #15803d; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 999px; padding: 3px 10px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #16a34a; display: block"></span>Connected</span>
                  <button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #e4e4e7; border-radius: 8px; background: #fff; font-family: inherit; font-size: 12.5px; font-weight: 600; color: #09090b; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: inline-flex; align-items: center; gap: 6px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"></path></svg>Refresh</button>
                  <button type="button" onClick="{{evt.reset}}" style="height: 32px; padding: 0 12px; border: 1px solid #e4e4e7; border-radius: 8px; background: #fff; font-family: inherit; font-size: 12.5px; font-weight: 600; color: #09090b; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05)">Disconnect</button>
                </sc-if>
              </div>

              <sc-if value="{{evt.form}}" hint-placeholder-val="{{true}}">
                <div style="display: flex; flex-direction: column; gap: 14px">
                  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 12px">
                    <sc-for list="{{evt.fields}}" as="f" hint-placeholder-count="5">
                      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 600; color: #3f3f46">
                        <span>{{f.label}} <span style="font-weight: 400; color: #a1a1aa">{{f.hint}}</span></span>
                        <input type="{{f.type}}" value="{{f.val}}" onInput="{{f.set}}" placeholder="{{f.ph}}" style="height: 38px; box-sizing: border-box; border: 1px solid #e4e4e7; border-radius: 8px; padding: 0 12px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #09090b; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.05)">
                      </label>
                    </sc-for>
                  </div>
                  <div style="display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border-radius: 10px; background: #fafafa; border: 1px solid #e4e4e7; font-size: 12.5px; line-height: 1.5; color: #52525b">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 2px; color: #71717a"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
                    <span>{{evt.note}}</span>
                  </div>
                  <div style="display: flex; align-items: center; gap: 12px">
                    <button type="button" onClick="{{evt.start}}" style="height: 40px; padding: 0 18px; border: 0; border-radius: 9px; background: #09090b; color: #fafafa; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer">Save &amp; connect</button>
                    <span style="font-size: 12.5px; color: #71717a">Cortex checks access, then reads the last 14 days of events.</span>
                  </div>
                </div>
              </sc-if>

              <sc-if value="{{evt.showSteps}}" hint-placeholder-val="{{false}}">
                <div style="border: 1px solid #e4e4e7; border-radius: 12px; background: #fafafa; padding: 6px 14px">
                  <sc-for list="{{evt.steps}}" as="s" hint-placeholder-count="3">
                    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: {{s.bt}}">
                      <span style="flex: 0 0 20px; width: 20px; height: 20px; margin-top: 1px; display: flex; align-items: center; justify-content: center">
                        <sc-if value="{{s.isDone}}" hint-placeholder-val="{{true}}"><span style="width: 20px; height: 20px; border-radius: 50%; background: #16a34a; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span></sc-if>
                        <sc-if value="{{s.isActive}}" hint-placeholder-val="{{false}}"><span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 2px solid #d4d4d8; border-top-color: #18181b; animation: obSpin 0.8s linear infinite; display: block"></span></sc-if>
                        <sc-if value="{{s.isWait}}" hint-placeholder-val="{{false}}"><span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 1.5px dashed #d4d4d8; display: block"></span></sc-if>
                      </span>
                      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                        <span style="display: flex; align-items: baseline; gap: 10px">
                          <b style="flex: 1; font-size: 13px; font-weight: 600; color: {{s.fg}}">{{s.label}}</b>
                          <sc-if value="{{s.hasPct}}" hint-placeholder-val="{{false}}"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #52525b">{{s.pct}}%</span></sc-if>
                        </span>
                        <span style="font-size: 12px; color: #71717a; line-height: 1.45">{{s.detail}}</span>
                        <sc-if value="{{s.hasBar}}" hint-placeholder-val="{{false}}">
                          <div style="height: 6px; border-radius: 4px; background: #e4e4e7; overflow: hidden; margin-top: 5px"><div style="height: 100%; border-radius: 4px; background: linear-gradient(90deg, #18181b, #3c8c81); width: {{s.pctW}}"></div></div>
                        </sc-if>
                      </span>
                    </div>
                  </sc-for>
                </div>
              </sc-if>

              <!-- Data preview (datastream picker, counts, top events): hidden for now, flip evt.preview to bring it back -->
              <sc-if value="{{evt.preview}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; flex-direction: column; gap: 18px">
                  <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
                    <label style="display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 600; color: #3f3f46">{{evt.dvLabel}}
                      <select style="height: 36px; min-width: 240px; box-sizing: border-box; border: 1px solid #e4e4e7; border-radius: 8px; padding: 0 10px; font-family: inherit; font-size: 13px; color: #09090b; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.05)">
                        <sc-for list="{{evt.dvOpts}}" as="o" hint-placeholder-count="2"><option>{{o.t}}</option></sc-for>
                      </select>
                    </label>
                    <span style="margin-left: auto; font-size: 12.5px; color: #71717a">Last 14 days, by day</span>
                  </div>

                  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px">
                    <sc-for list="{{evt.cards}}" as="c" hint-placeholder-count="3">
                      <div style="border: 1px solid #e4e4e7; border-radius: 12px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px">
                        <div style="display: flex; align-items: baseline; justify-content: space-between">
                          <span style="font-size: 12px; font-weight: 600; color: #71717a">{{c.label}}</span>
                          <span style="font-size: 11.5px; font-weight: 600; color: #15803d">{{c.delta}}</span>
                        </div>
                        <div style="font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1">{{c.n}}</div>
                        <div style="display: flex; align-items: flex-end; gap: 3px; height: 38px">
                          <sc-for list="{{c.bars}}" as="b" hint-placeholder-count="14">
                            <span style="flex: 1; border-radius: 2px 2px 0 0; background: {{b.bg}}; height: {{b.h}}"></span>
                          </sc-for>
                        </div>
                      </div>
                    </sc-for>
                  </div>

                  <div>
                    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #71717a; margin-bottom: 10px">Top event types</div>
                    <div style="display: flex; flex-direction: column; gap: 9px">
                      <sc-for list="{{evt.top}}" as="t" hint-placeholder-count="5">
                        <div style="display: grid; grid-template-columns: minmax(150px, 280px) 1fr 56px; align-items: center; gap: 14px">
                          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #3f3f46; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span>
                          <span style="height: 8px; border-radius: 4px; background: #f4f4f5; overflow: hidden; display: block"><span style="display: block; height: 100%; border-radius: 4px; background: #3c8c81; width: {{t.w}}"></span></span>
                          <span style="font-size: 12.5px; font-weight: 600; text-align: right">{{t.n}}</span>
                        </div>
                      </sc-for>
                    </div>
                  </div>
                </div>
              </sc-if>
            </div>
            </sc-if>

            <sc-if value="{{evt.anyConn}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; border: 1px solid #bbf7d0; background: #f0fdf4; font-size: 13px; line-height: 1.45; color: #3f3f46">
                <span style="flex: 0 0 20px; width: 20px; height: 20px; border-radius: 50%; background: #16a34a; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>

        srcs: [['hubspot', 'HubSpot', 'hubspot.com'], ['sfmc', 'Salesforce Marketing Cloud', 'salesforce.com'], ['braze', 'Braze', 'braze.com'],
          ['klaviyo', 'Klaviyo', 'klaviyo.com'], ['iterable', 'Iterable', 'iterable.com'], ['attentive', 'Attentive', 'attentive.com']] }
    };
    // CSV import and mock data for each group: [file, file meta, what the CSV needs, mock title, mock pack]
    var ALT = {
      catalog: ['sephora_catalog.csv', '18 MB · 12,480 rows · 14 columns', 'Needs a product ID, title, price and URL. Cortex maps the rest.', 'Product catalog pack', [['12,480', 'products'], ['640', 'categories'], ['4', 'regions']]],
      oms: ['sephora_orders_90d.csv', '41 MB · 38,200 rows · 12 columns', 'Needs an order ID, date, items and status. Cortex maps the rest.', 'Orders pack', [['38,200', 'orders'], ['2,140', 'returns'], ['90 days', 'of history']]],
      cms: ['sephora_content.csv', '6 MB · 1,550 rows · 8 columns', 'Needs a title, URL and body or summary. Cortex maps the rest.', 'Content pack', [['1,240', 'pages and stories'], ['310', 'banners'], ['42', 'guides']]],
      cs: ['sephora_tickets_90d.csv', '22 MB · 9,860 rows · 10 columns', 'Needs a ticket ID, date, channel and reason. Cortex maps the rest.', 'Service pack', [['9,860', 'tickets and chats'], ['1,120', 'return reasons'], ['90 days', 'of history']]],
      crm: ['sephora_contacts.csv', '64 MB · 412,000 rows · 11 columns', 'Needs an email or customer ID. Cortex hashes it before import.', 'Contacts pack', [['412K', 'contacts'], ['86', 'segments'], ['64%', 'opted in']]]
    };
    function group(gid) {
      var G = GROUPS[gid], A = ALT[gid], pid = st.pick[gid], s = null;
      var gmode = st.gmode[gid] || 'connect', csvKey = gid + ':csv', cs = st.status[csvKey] || 'idle';
      G.srcs.forEach(function (x) { if (x[0] === pid) s = x; });
      var key = s ? gid + ':' + s[0] : null, gs = key ? st.status[key] || 'idle' : 'idle', gv = (key && st.vals[key]) || {};
      var doneSrcs = G.srcs.filter(function (x) { return st.status[gid + ':' + x[0]] === 'done'; });
      var anyRun = G.srcs.some(function (x) { return st.status[gid + ':' + x[0]] === 'running'; });
      var connDone = doneSrcs.length > 0;
      var gDone = gmode === 'connect' ? connDone : gmode === 'csv' ? cs === 'done' : true;
      return {
        name: G.name, blurb: G.blurb, noun: G.noun,
        modes: seg([['connect', 'Connect'], ['csv', 'Upload CSV'], ['mock', 'Mock data']], gmode, function (m) { var o = Object.assign({}, self.state.gmode); o[gid] = m; self.setState({ gmode: o }); }),
        isConnect: gmode === 'connect', isCsv: gmode === 'csv', isMock: gmode === 'mock',
        csvIdle: cs === 'idle', csvHasFile: cs !== 'idle', csvDone: cs === 'done', csvFile: A[0], csvMeta: A[1], csvNeeds: A[2],
        csvSteps: stepsFor(csvKey, [
          ['Checking the file', 'Reading columns and sampling rows…', A[1].split(' · ').slice(2).join('') + ' found'],
          ['Mapping fields', 'Matching columns to ADX fields…', 'Columns mapped to ADX ' + G.noun],
          ['Bringing in ' + G.noun, '', G.done]
        ], G.total, G.noun, 'Importing ' + G.noun),
        upload: function () { self.connect(csvKey); }, csvReset: function () { self.disconnect(csvKey); },
        mockTitle: A[3], pack: A[4].map(function (x) { return { n: x[0], l: x[1] }; }),
        tiles: G.srcs.map(function (x) {
          var k = gid + ':' + x[0], sel = pid === x[0];
          return { name: x[1], logo: logo(x[2]), detected: G.detected === x[0], on: st.status[k] === 'done', running: st.status[k] === 'running', sel: sel ? 'true' : 'false',
            bd: sel ? '#18181b' : '#e4e4e7', ring: sel ? '0 0 0 3px #f4f4f5' : 'none',
            pick: function () { if (self.state.status[key] === 'running') return; var p = Object.assign({}, self.state.pick); p[gid] = p[gid] === x[0] ? null : x[0]; self.setState({ pick: p }); } };
        }),
        hasSrc: !!s, noSrc: !s, pickHint: G.detected ? 'We found Salesforce Commerce Cloud on sephora.com. Pick it, or another source.' : 'Pick a source above.',
        src: s ? { name: s[1], logo: logo(s[2]) } : {}, desc: 'Read-only access to your ' + G.noun + '.',
        fields: FORMS[G.form].map(function (f, i) {
          return { label: f[0], ph: f[1], type: f[2], val: gv[i] != null ? gv[i] : '',
            set: function (ev) { var all = Object.assign({}, self.state.vals); all[key] = Object.assign({}, all[key]); all[key][i] = ev.target.value; self.setState({ vals: all }); } };
        }),
        form: !!s && gs === 'idle', showSteps: gs !== 'idle', isDone: gs === 'done',
        steps: s ? stepsFor(key, [
          ['Checking access', 'Checking credentials…', 'Credentials accepted · read-only scope'],
          ['Connecting to ' + s[1], 'Opening a read-only connection…', 'Connected to ' + s[1]],
          ['Bringing in ' + G.noun, '', G.done]
        ], G.total, G.noun, 'Reading ' + G.noun) : [],
        start: function () { self.connect(key); }, reset: function () { self.disconnect(key); },
        done: gDone, stText: gDone ? (gmode === 'connect' ? doneSrcs.map(function (x) { return x[1]; }).join(', ') : gmode === 'csv' ? 'CSV imported' : 'Mock data') : anyRun || cs === 'running' ? 'Connecting…' : 'Add',
        stFg: gDone ? '#15803d' : '#71717a', stWeight: gDone ? '600' : '400'
      };
    }
    function accordion(g, id) {
      var open = !!st.open[id];
      g.open = open; g.exp = open ? 'true' : 'false'; g.rot = open ? '180deg' : '0deg';
      g.toggle = function () { var o = Object.assign({}, self.state.open); o[id] = !o[id]; self.setState({ open: o }); };
      return g;
    }
    accordion(evt, 'evt'); evt.done = evtDone;
    var cat = accordion(group('catalog'), 'catalog'), catDone = cat.done;
    var opt = ['oms', 'cms', 'cs', 'crm'].map(function (gid, i) {
      var g = group(gid);
      g.bt = i ? '1px solid #e4e4e7' : '0';
      g.isOms = gid === 'oms'; g.isCms = gid === 'cms'; g.isCs = gid === 'cs'; g.isCrm = gid === 'crm';
      return accordion(g, gid);
    });
    var ready = evtDone && catDone;

    return {
      evt: evt, cat: cat, catList: [cat], opt: opt, ready: ready, notReady: !ready,
      meta: ready ? 'Step 2 of 3' : !evtDone && !catDone ? 'Step 2 of 3 · connect web signals and a product catalog to continue' : !evtDone ? 'Step 2 of 3 · connect web signals to continue' : 'Step 2 of 3 · connect a product catalog to continue'
    };
  }
}
