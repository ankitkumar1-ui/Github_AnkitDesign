<div class="as-main">
  <div class="pagehead"><div><div class="eyebrow">ADX Setup · Web Signals</div><h1>Add a signal manually</h1><p>For behaviour the scan could not find and Browse &amp; label cannot reach: anything behind a login, or fired only by your own code.</p></div></div>

  <sc-if value="{{editing}}" hint-placeholder-val="{{true}}">
  <div class="as-form">
    <label class="as-field">
      <span class="as-lbl">Signal name</span>
      <input class="as-input mono" value="{{name}}" onInput="{{onName}}" placeholder="e.g. checkout_step_completed" spellcheck="false" autocomplete="off">
      <span class="as-hint">Lowercase with underscores. This is the name your experiences and triggers use.</span>
    </label>
    <sc-if value="{{dupe}}" hint-placeholder-val="{{false}}">
      <div class="as-warn err"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4M12 16h.01"></path></svg><span><b>{{name}}</b> already exists. Pick another name, or open the existing signal.</span></div>
    </sc-if>
    <sc-if value="{{near}}" hint-placeholder-val="{{false}}">
      <div class="as-warn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg><span>Close to <b>{{nearSig.id}}</b>, already active. Different step, or the same thing named twice? <button type="button" class="as-link" onClick="{{toggleCompare}}">{{compareLabel}}</button></span></div>
      <sc-if value="{{comparing}}" hint-placeholder-val="{{false}}">
        <div class="as-compare">
          <div><span class="as-cmp-k">Existing · active</span><b class="mono">{{nearSig.id}}</b><span>{{nearSig.desc}}</span><span class="as-cmp-m">{{nearSig.seen}}</span></div>
          <div><span class="as-cmp-k">Yours · new</span><b class="mono">{{name}}</b><span>{{meaningOrHint}}</span><span class="as-cmp-m">Not created yet</span></div>
        </div>
      </sc-if>
    </sc-if>

    <label class="as-field">
      <span class="as-lbl">What it means</span>
      <textarea class="as-input as-ta" onInput="{{onMeaning}}" placeholder="Shopper completes a named step inside checkout: shipping, payment or review.">{{meaning}}</textarea>
      <span class="as-hint">Whoever builds a trigger on this reads your sentence, not the payload. Be specific about when it fires.</span>
    </label>

    <div class="as-field">
      <span class="as-lbl">How will it be captured?</span>
      <div role="radiogroup" aria-label="Capture method" class="as-opts">
        <sc-for list="{{methods}}" as="m" hint-placeholder-count="4">
          <button type="button" role="radio" aria-checked="{{m.sel}}" onClick="{{m.pick}}" class="as-opt {{m.cls}}">
            <span class="as-radio"><span></span></span>
            <span class="as-opt-t"><b>{{m.title}}</b><span>{{m.desc}}</span></span>
          </button>
        </sc-for>
      </div>
    </div>

    <!-- SDK call -->
    <sc-if value="{{isSdk}}" hint-placeholder-val="{{true}}">
      <div class="as-panel">
        <b class="as-panel-h">Give this to whoever owns the site</b>
        <pre class="as-code">{{snippet}}</pre>
        <div class="as-row">
          <button type="button" class="btn" onClick="{{copy}}">{{copyLabel}}</button>
          <a class="btn" href="{{mailto}}" style="text-decoration:none">Email to a developer</a>
        </div>
      </div>
    </sc-if>

    <!-- Data layer key -->
    <sc-if value="{{isDl}}" hint-placeholder-val="{{false}}">
      <div class="as-panel">
        <b class="as-panel-h">Which data layer push should fire it?</b>
        <div class="as-two">
          <label class="as-field"><span class="as-lbl sm">Data layer</span>
            <select class="as-input" onChange="{{onDlSrc}}"><sc-for list="{{dlSrcs}}" as="o"><option value="{{o.k}}" selected="{{o.sel}}">{{o.l}}</option></sc-for></select></label>
          <label class="as-field"><span class="as-lbl sm">Key and value</span>
            <input class="as-input mono" value="{{dlKey}}" onInput="{{onDlKey}}" placeholder="event = checkoutStep" spellcheck="false"></label>
        </div>
        <span class="as-hint">Cortex listens for this push on every page. Nothing changes on your site.</span>
        <pre class="as-code">{{dlExample}}</pre>
      </div>
    </sc-if>

    <!-- URL pattern -->
    <sc-if value="{{isUrl}}" hint-placeholder-val="{{false}}">
      <div class="as-panel">
        <b class="as-panel-h">Fire when the shopper lands on</b>
        <input class="as-input mono" value="{{pattern}}" onInput="{{onPattern}}" placeholder="/checkout/confirmation*" spellcheck="false">
        <span class="as-hint">Use * as a wildcard. Checked against pages Cortex has seen on sephora.com.</span>
        <div class="as-urls">
          <sc-for list="{{urls}}" as="u" hint-placeholder-count="5">
            <div class="as-url {{u.cls}}"><span class="as-dot"></span><span class="mono">{{u.path}}</span><span class="as-url-m">{{u.label}}</span></div>
          </sc-for>
        </div>
        <span class="as-hint">{{urlSummary}}</span>
      </div>
    </sc-if>

    <!-- Element interaction -->
    <sc-if value="{{isEl}}" hint-placeholder-val="{{false}}">
      <div class="as-panel as-el">
        <span class="as-el-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 4 7 17 2.5-7.5L21 11z"></path></svg></span>
        <span style="flex:1;min-width:0"><b class="as-panel-h">Point at it on your own site</b><span class="as-hint" style="display:block;margin-top:2px">Browse sephora.com like a shopper and click the button, link or form this signal should track. Cortex records the selector for you.</span></span>
        <a class="btn" href="#/web-signals" style="text-decoration:none">Open Browse &amp; label</a>
      </div>
    </sc-if>

    <div class="as-actions">
      <button type="button" class="btn primary lg" onClick="{{create}}" disabled="{{cantCreate}}">Create signal</button>
      <a class="btn lg" href="#/web-signals" style="text-decoration:none">Cancel</a>
      <span class="as-hint" style="margin:0">{{createHint}}</span>
    </div>
  </div>
  </sc-if>

  <!-- created -->
  <sc-if value="{{created}}" hint-placeholder-val="{{false}}">
    <div class="as-done">
      <span class="as-done-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b class="mono" style="font-size:15px">{{name}}</b><span class="as-pill"><span class="ws-spin-s"></span>Pending first event</span></div>
        <p>Created and listening in dev, captured by <b>{{methodTitle}}</b>. It moves to Ready as soon as the first payload arrives.</p>
        <div class="as-row">
          <a class="btn primary" href="#/web-signals" style="text-decoration:none">Back to Web Signals</a>
          <button type="button" class="btn" onClick="{{again}}">Add another</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>

<aside class="as-side">
  <div class="card as-next">
    <b class="as-next-h">What happens next</b>
    <ol>
      <sc-for list="{{next}}" as="n" hint-placeholder-count="4">
        <li class="{{n.cls}}"><span class="as-num">{{n.mark}}</span><span>{{n.t}}</span></li>
      </sc-for>
    </ol>
    <p>The signal sits in <b>Pending first event</b> until a real payload arrives. It cannot be promoted to production before then.</p>
  </div>
</aside>
</div>
</div>
</div>
</div>
</template>
<script type="text/x-dc">
/* Add a signal manually (Web Signals · Add manually).
   Prefilled with the example from the canvas so the "close to an active signal" check shows straight away. */
var AS_ACTIVE = [
  { id: 'checkout_started', desc: 'Shopper opens checkout from the basket.', seen: 'Seen 18 times today' },
  { id: 'product_viewed', desc: 'Shopper opens a product page.', seen: 'Seen 48 times today' },
  { id: 'search_performed', desc: 'Shopper runs a site search.', seen: 'Seen 31 times today' },
  { id: 'cart_viewed', desc: 'Shopper opens the basket.', seen: 'Seen 9 times today' },
  { id: 'add_to_cart', desc: 'An item is added to the basket.', seen: 'Seen 12 times today' },
  { id: 'review_read', desc: 'Shopper expands a product review.', seen: 'Seen 22 times today' },
  { id: 'category_viewed', desc: 'Shopper opens a category page.', seen: 'Seen 63 times today' },
  { id: 'gift_card_completed', desc: 'Shopper finishes the gift-card form.', seen: 'Seen 3 times today' },
  { id: 'newsletter_signed_up', desc: 'Shopper subscribes to emails.', seen: 'Seen 5 times today' },
  { id: 'store_locator_opened', desc: 'Shopper opens the store locator.', seen: 'Seen 4 times today' }
];
var AS_METHODS = [
  ['sdk', 'SDK call', 'Your developer adds one line. We generate it below. Best when the event has data only your code knows.'],
  ['dl', 'Data layer key', 'Listen for a key your tag manager already pushes. No code change.'],
  ['url', 'URL pattern', 'Fires on navigation matching a pattern. Good for confirmation and thank-you pages.'],
  ['el', 'Element interaction', 'Point at it on your own site instead. Opens Browse & label.']
];
var AS_DL = [['adobeDataLayer', 'adobeDataLayer (Adobe)'], ['utag_data', 'utag_data (Tealium)'], ['dataLayer', 'dataLayer (GTM)']];
var AS_PAGES = ['/checkout/shipping', '/checkout/payment', '/checkout/review', '/checkout/confirmation?order=SEP-48213', '/basket', '/product/P483021', '/shop/skincare'];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: 'checkout_step_completed', meaning: 'Shopper completes a named step inside checkout: shipping, payment or review.',
      method: 'sdk', comparing: false, copied: false, dlSrc: 'adobeDataLayer', dlKey: 'event = checkoutStep', pattern: '/checkout/confirmation*', created: false };
  }
  componentWillUnmount() { clearTimeout(this.copyT); }
  renderVals() {
    var self = this, st = this.state, name = st.name;
    var dupe = AS_ACTIVE.filter(function (s) { return s.id === name; })[0];
    var head = name.split('_')[0];
    var near = !dupe && head.length > 2 ? AS_ACTIVE.filter(function (s) { return s.id.split('_')[0] === head; })[0] : null;
    var nameOk = /^[a-z][a-z0-9_]*[a-z0-9]$/.test(name);

    // SDK snippet: a checkout-shaped payload for checkout signals, a minimal one otherwise
    var sig = name || 'your_signal';
    var payload = /checkout|cart|basket|order/.test(sig)
      ? "  step: 'shipping',\n  cart: { value: 68.50, item_count: 3 }"
      : "  page_url: location.pathname";
    var snippet = "adx.track('" + sig + "', {\n" + payload + "\n});";

    // data layer: "key = value" → example push
    var kv = st.dlKey.split('='), dk = (kv[0] || '').trim(), dv = (kv[1] || '').trim();
    var dlExample = 'window.' + st.dlSrc + '.push({\n  ' + (dk || 'event') + ": '" + (dv || '…') + "',\n  // the rest of the push becomes the signal's payload\n});";

    // URL pattern: * is a wildcard; the query string is ignored unless the pattern has one
    var pat = st.pattern.trim(), rx = null;
    if (pat) { try { rx = new RegExp('^' + pat.replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*') + '$'); } catch (e) { rx = null; } }
    var hits = 0;
    var urls = AS_PAGES.map(function (u) {
      var path = pat.indexOf('?') < 0 ? u.split('?')[0] : u, hit = !!(rx && rx.test(path));
      if (hit) hits++;
      return { path: u, cls: hit ? 'hit' : '', label: hit ? 'Matches' : '' };
    });

    var missing = !nameOk ? 'Add a signal name' : dupe ? 'Pick a name that isn’t taken' : !st.meaning.trim() ? 'Say what it means'
      : st.method === 'url' && !hits ? 'The pattern matches no pages yet' : st.method === 'dl' && !dk ? 'Add the data layer key' : '';
    var method = AS_METHODS.filter(function (m) { return m[0] === st.method; })[0];
    var NEXT = ['Signal is created and starts listening in dev', 'First payload arrives: we infer its object and field types', 'You promote the fields you need into variables', 'Promote the signal to production when it looks right'];

    return {
      editing: !st.created, created: st.created,
      name: name, meaning: st.meaning, meaningOrHint: st.meaning.trim() || 'No description yet',
      onName: function (e) { self.setState({ name: e.target.value.toLowerCase().replace(/[\s-]+/g, '_').replace(/[^a-z0-9_]/g, ''), comparing: false }); },
      onMeaning: function (e) { self.setState({ meaning: e.target.value }); },
      dupe: !!dupe, near: !!near, nearSig: near || {}, comparing: st.comparing, compareLabel: st.comparing ? 'Hide' : 'Compare',
      toggleCompare: function () { self.setState({ comparing: !self.state.comparing }); },
      methods: AS_METHODS.map(function (m) {
        return { title: m[1], desc: m[2], sel: st.method === m[0] ? 'true' : 'false', cls: st.method === m[0] ? 'on' : '',
          pick: function () { self.setState({ method: m[0] }); } };
      }),
      isSdk: st.method === 'sdk', isDl: st.method === 'dl', isUrl: st.method === 'url', isEl: st.method === 'el',
      snippet: snippet, copyLabel: st.copied ? 'Copied' : 'Copy snippet',
      copy: function () {
        try { navigator.clipboard.writeText(snippet); } catch (e) {}
        self.setState({ copied: true }); clearTimeout(self.copyT); self.copyT = setTimeout(function () { self.setState({ copied: false }); }, 1600);
      },
      mailto: 'mailto:?subject=' + encodeURIComponent('ADX signal to add: ' + sig) + '&body=' + encodeURIComponent((st.meaning ? st.meaning + '\n\n' : '') + 'Please add this where it happens on sephora.com:\n\n' + snippet + '\n'),
      dlSrcs: AS_DL.map(function (d) { return { k: d[0], l: d[1], sel: st.dlSrc === d[0] }; }),
      onDlSrc: function (e) { self.setState({ dlSrc: e.target.value }); },
      dlKey: st.dlKey, onDlKey: function (e) { self.setState({ dlKey: e.target.value }); }, dlExample: dlExample,
      pattern: st.pattern, onPattern: function (e) { self.setState({ pattern: e.target.value }); },
      urls: urls, urlSummary: !pat ? 'Type a pattern to see which pages match.' : hits ? 'Matches ' + hits + ' of ' + AS_PAGES.length + ' pages Cortex has seen.' : 'No pages Cortex has seen match this yet.',
      cantCreate: !!missing, createHint: missing,
      create: function () { if (!missing) { self.setState({ created: true }); window.scrollTo(0, 0); } },
      methodTitle: method[1],
      again: function () { self.setState({ created: false, name: '', meaning: '', comparing: false, method: 'sdk' }); },
      next: NEXT.map(function (t, i) {
        var done = st.created && i === 0, cur = st.created && i === 1;
        return { t: t, mark: done ? '✓' : String(i + 1), cls: done ? 'done' : cur ? 'cur' : '' };
      })
    };
  }
}
</script>
