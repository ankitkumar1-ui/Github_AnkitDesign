.dv-note{font-size:12px;line-height:1.5;color:var(--muted);background:rgba(60,140,129,.07);border-radius:8px;padding:8px 10px}

<div class="wrap">
  <div class="pagehead"><div><div class="eyebrow">ADX Setup</div><h1>Website Signals &amp; Behavior</h1><p>Website behavior captured as signals your experiences can use.</p></div></div>
  <div class="dtabs"><a class="dtab" href="#/web-signals" style="text-decoration:none">Source &amp; mapping</a><a class="dtab" href="#/signals" style="text-decoration:none">Signals<span class="tcount">{{sigN}}</span></a><button class="dtab on">Derived signals<span class="tcount">{{n}}</span></button></div>

  <!-- zero state -->
  <sc-if value="{{isEmpty}}">
    <section class="dv-empty">
      <span class="dv-glyph" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"></circle><circle cx="6" cy="18" r="2.5"></circle><path d="M8.5 6H12a3 3 0 0 1 3 3v1.5M8.5 18H12a3 3 0 0 0 3-3v-1.5M15 12h6.5"></path></svg></span>
      <b>You haven't created a derived signal yet</b>
      <p>A derived signal combines signals you already capture into one trigger of your own, like <em>scrolled past 4,000 px and stayed 8 seconds</em>. Scans and connectors never create these. You decide what the moment is.</p>
      <button class="btn primary" onClick="{{create}}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Create derived signal</button>
      <div class="dv-or">Or start from an example</div>
      <div class="dv-tpls">
        <sc-for list="{{tpls}}" as="t">
          <button type="button" class="dv-tpl" onClick="{{t.use}}">
            <span class="pg">{{t.page}}</span>
            <code class="sg-code">{{t.id}}</code>
            <span class="r">{{t.rule}}</span>
            <span class="u">{{t.use_for}}</span>
          </button>
        </sc-for>
      </div>
    </section>
  </sc-if>

  <!-- saved derived signals -->
  <sc-if value="{{hasList}}">
    <div class="sg-tools">
      <span style="font-size:14px;color:var(--muted)">Your own triggers, built from captured signals. Use them in Experiences like any other signal.</span>
      <span class="sg-sp"></span>
      <button class="btn primary" onClick="{{create}}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Create derived signal</button>
    </div>
    <section class="sg-tbl">
      <div class="dv-row hd"><span>Derived signal</span><span>Fires when</span><span>Built from</span><span>Status</span><span>Used in</span></div>
      <sc-for list="{{list}}" as="s">
        <button type="button" class="dv-row" onClick="{{s.edit}}">
          <span style="display:flex;flex-direction:column;gap:2px;min-width:0"><code class="sg-code">{{s.id}}</code><span class="sg-mut" style="font-size:12px">{{s.desc}}</span></span>
          <span class="sg-mut" style="font-size:12px;line-height:1.45">{{s.rule}}</span>
          <span class="dv-chips"><sc-for list="{{s.uses}}" as="u"><i>{{u.t}}</i></sc-for></span>
          <span><span class="sg-pill exc"><i></i>Draft · Development</span></span>
          <span class="sg-mut" style="font-size:12px">No experiences yet</span>
        </button>
      </sc-for>
    </section>
  </sc-if>

  <!-- builder -->
  <sc-if value="{{building}}">
    <div class="dv-build">
      <section class="sg-card" style="margin:0">
        <div class="sg-ch"><b>{{b.title}}</b><span>Combine signals into one trigger</span></div>

        <div class="dv-sec">
          <div class="dv-lbl">Name</div>
          <div class="dv-two">
            <label class="dv-f"><span>Signal name</span><input class="dv-in mono" value="{{b.name}}" onInput="{{b.onName}}" placeholder="engaged_reader"></label>
            <label class="dv-f"><span>What it means <em>(optional)</em></span><input class="dv-in" value="{{b.desc}}" onInput="{{b.onDesc}}" placeholder="Shopper is clearly reading the page"></label>
          </div>
        </div>

        <div class="dv-sec">
          <div class="dv-lbl">Conditions</div>
          <div class="dv-mode">Fire when
            <span class="sg-seg" style="margin:0"><button class="{{b.allOn}}" onClick="{{b.setAll}}">all</button><button class="{{b.anyOn}}" onClick="{{b.setAny}}">any</button></span>
            of these are true</div>
          <sc-for list="{{b.conds}}" as="c">
            <div class="dv-cond">
              <span class="dv-join">{{c.join}}</span>
              <select class="sg-sel dv-what" onChange="{{c.onWhat}}" aria-label="Signal or measure">
                <sc-for list="{{c.groups}}" as="g"><optgroup label="{{g.label}}"><sc-for list="{{g.opts}}" as="o"><option value="{{o.k}}" selected="{{o.sel}}">{{o.l}}</option></sc-for></optgroup></sc-for>
              </select>
              <select class="sg-sel" onChange="{{c.onOp}}" aria-label="Condition"><sc-for list="{{c.ops}}" as="o"><option value="{{o.k}}" selected="{{o.sel}}">{{o.l}}</option></sc-for></select>
              <sc-if value="{{c.needsVal}}"><span class="dv-val"><input class="dv-in mono" value="{{c.val}}" onInput="{{c.onVal}}" placeholder="{{c.ph}}" aria-label="Value"><sc-if value="{{c.unit}}"><em>{{c.unit}}</em></sc-if></span></sc-if>
              <button type="button" class="dv-x" onClick="{{c.remove}}" aria-label="Remove condition" title="Remove"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
            </div>
          </sc-for>
          <button type="button" class="dv-add" onClick="{{b.addCond}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add condition</button>
        </div>

        <div class="dv-sec">
          <div class="dv-lbl">Timing</div>
          <div class="dv-two">
            <label class="dv-f"><span>All within</span><select class="sg-sel" onChange="{{b.onWin}}"><sc-for list="{{b.wins}}" as="o"><option value="{{o.k}}" selected="{{o.sel}}">{{o.l}}</option></sc-for></select></label>
            <label class="dv-f"><span>Fire</span><select class="sg-sel" onChange="{{b.onFreq}}"><sc-for list="{{b.freqs}}" as="o"><option value="{{o.k}}" selected="{{o.sel}}">{{o.l}}</option></sc-for></select></label>
          </div>
        </div>

        <div class="dv-foot">
          <sc-if value="{{b.canDelete}}"><button class="btn ghost" onClick="{{b.del}}" style="color:#b91c1c">Delete</button></sc-if>
          <span class="sg-sp"></span>
          <button class="btn" onClick="{{b.cancel}}">Cancel</button>
          <button class="btn primary" onClick="{{b.save}}" disabled="{{b.cantSave}}">Save derived signal</button>
        </div>
      </section>

      <aside class="dv-prev">
        <div class="dv-lbl" style="padding:0">Preview</div>
        <code class="sg-code" style="font-size:14px">{{b.idShown}}</code>
        <p>{{b.sentence}}</p>
        <div class="dv-lbl" style="padding:0">Built from</div>
        <div class="dv-chips"><sc-for list="{{b.uses}}" as="u"><i>{{u.t}}</i></sc-for><sc-if value="{{b.noUses}}"><span class="sg-mut" style="font-size:12px">Add a condition</span></sc-if></div>
        <div class="dv-est"><b>{{b.est}}</b><span>{{b.estNote}}</span></div>
        <div class="dv-note">Saved to Development. It shows up as a trigger in Experiences next to your captured signals.</div>
      </aside>
    </div>
  </sc-if>

  <sc-if value="{{toast}}"><div class="sg-toast">{{toast}}</div></sc-if>
</div>
</div>
</div>
</template>
<script type="text/x-dc">
/* Derived signals: triggers people build by combining captured signals (never auto-detected, so the list starts empty).
   Saved ones live in window.ADX_DERIVED so the tab counts on Web Signals and Signals stay in sync. */
// what a condition can check: behaviour measures, captured signals (events) and their variables
var DV_WHAT = [
  ['Behavior', [
    ['scroll_depth', 'Scroll depth', 'num', 'px'], ['dwell_time', 'Time on page', 'num', 's'], ['pages_viewed', 'Pages viewed in session', 'num', 'pages'],
    ['session_length', 'Session length', 'num', 'min'], ['visit_number', 'Visit number', 'num', ''], ['page_type', 'Page type', 'str', '']]],
  ['Signals', [
    ['product_viewed', 'product_viewed', 'event', ''], ['category_viewed', 'category_viewed', 'event', ''], ['search_performed', 'search_performed', 'event', ''],
    ['review_read', 'review_read', 'event', ''], ['size_guide_scrolled', 'size_guide_scrolled', 'event', ''], ['add_to_cart', 'add_to_cart', 'event', ''],
    ['cart_viewed', 'cart_viewed', 'event', ''], ['checkout_started', 'checkout_started', 'event', ''], ['newsletter_signed_up', 'newsletter_signed_up', 'event', ''],
    ['variant_selected', 'variant_selected', 'event', ''], ['wishlist_added', 'wishlist_added', 'event', ''], ['filters_applied', 'filters_applied', 'event', '']]],
  ['Signal variables', [
    ['cart_viewed.cart_value', 'cart_viewed · cart_value', 'num', '$'], ['cart_viewed.item_count', 'cart_viewed · item_count', 'num', 'items'],
    ['product_viewed.category', 'product_viewed · category', 'str', ''], ['product_viewed.brand', 'product_viewed · brand', 'str', ''],
    ['product_viewed.price', 'product_viewed · price', 'num', '$'], ['search_performed.query', 'search_performed · query', 'str', ''],
    ['filters_applied.results_count', 'filters_applied · results_count', 'num', 'results']]]
];
var DV_OPS = {
  num: [['gt', 'is more than'], ['gte', 'is at least'], ['lt', 'is less than'], ['eq', 'equals']],
  event: [['did', 'happened'], ['atleast', 'happened at least'], ['not', 'did not happen']],
  str: [['is', 'is'], ['contains', 'contains'], ['isnot', 'is not']]
};
var DV_WIN = [['page', 'the same page view'], ['session', 'the same session'], ['10m', '10 minutes'], ['30m', '30 minutes']];
var DV_FREQ = [['once', 'Once per session'], ['each', 'Every time it becomes true']];
var DV_TPL = [
  { id: 'window_shopper', page: 'Product list page', desc: 'Looked at several products and added none', mode: 'all', win: 'session', freq: 'once', use_for: 'Recommended for you, rearrange the list',
    conds: [{ what: 'product_viewed', op: 'atleast', val: '5' }, { what: 'add_to_cart', op: 'not', val: '' }] },
  { id: 'browsing_without_clicking', page: 'Product list page', desc: 'Stays on the list without opening a product', mode: 'all', win: 'page', freq: 'once', use_for: 'Show a Recommended for you strip',
    conds: [{ what: 'page_type', op: 'is', val: 'Product list page' }, { what: 'dwell_time', op: 'gt', val: '20' }, { what: 'product_viewed', op: 'not', val: '' }] },
  { id: 'few_results', page: 'Product list page', desc: 'Filters left almost nothing to choose from', mode: 'all', win: 'page', freq: 'each', use_for: 'Suggest relaxing a filter or alternatives',
    conds: [{ what: 'filters_applied.results_count', op: 'lt', val: '5' }] },
  { id: 'variant_dithering', page: 'Product page', desc: 'Tried several variants without adding one', mode: 'all', win: '10m', freq: 'once', use_for: 'Variant recommendation, shade match',
    conds: [{ what: 'variant_selected', op: 'atleast', val: '3' }, { what: 'add_to_cart', op: 'not', val: '' }] },
  { id: 'engaged_reader', page: 'Product page', desc: 'Shopper is clearly reading the page', mode: 'all', win: 'page', freq: 'once', use_for: 'Offer a guide or the shade quiz',
    conds: [{ what: 'scroll_depth', op: 'gt', val: '4000' }, { what: 'dwell_time', op: 'gt', val: '8' }] },
  { id: 'hesitant_buyer', page: 'Checkout', desc: 'Added to basket but has not started checkout', mode: 'all', win: '10m', freq: 'once', use_for: 'Nudge with free shipping',
    conds: [{ what: 'add_to_cart', op: 'did', val: '' }, { what: 'checkout_started', op: 'not', val: '' }] }
];
function dvFind(k) { for (var i = 0; i < DV_WHAT.length; i++) for (var j = 0; j < DV_WHAT[i][1].length; j++) if (DV_WHAT[i][1][j][0] === k) return DV_WHAT[i][1][j]; return DV_WHAT[0][1][0]; }
function dvStore() { if (!window.ADX_DERIVED) window.ADX_DERIVED = []; return window.ADX_DERIVED; }
function dvOpLabel(kind, op) { return (DV_OPS[kind].filter(function (o) { return o[0] === op; })[0] || DV_OPS[kind][0])[1]; }
function dvNeedsVal(kind, op) { return kind !== 'event' || op === 'atleast'; }
function dvFmt(v) { return /^\d{4,}$/.test(v) ? Number(v).toLocaleString('en-US') : v; }
// "scroll depth is more than 4,000 px"
function dvPhrase(c) {
  var w = dvFind(c.what), kind = w[2], v = (c.val || '').trim();
  if (kind === 'event') return w[1] + ' ' + (c.op === 'atleast' ? 'happened at least ' + (v || '…') + ' times' : dvOpLabel(kind, c.op));
  var val = v ? (w[3] === '$' ? '$' + dvFmt(v) : kind === 'str' ? '“' + v + '”' : dvFmt(v) + (w[3] ? ' ' + w[3] : '')) : '…';
  return (w[1].indexOf('·') > 0 ? w[1].replace(' · ', '.') : w[1].toLowerCase()) + ' ' + dvOpLabel(kind, c.op) + ' ' + val;
}
function dvRule(b) {
  var j = b.mode === 'all' ? ' and ' : ' or ';
  return b.conds.map(dvPhrase).join(j) + (b.win === 'page' ? ', on the same page' : b.win === 'session' ? ', in one session' : ', within ' + b.win.replace('m', ' minutes'));
}
function dvUses(b) { var seen = {}; return b.conds.map(function (c) { var k = c.what.split('.')[0]; return dvFind(k)[2] === 'event' || c.what.indexOf('.') > 0 ? k : dvFind(c.what)[1]; }).filter(function (k) { if (seen[k]) return false; seen[k] = 1; return true; }).map(function (t) { return { t: t }; }); }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { b: null, editing: null, tick: 0, toast: '' };
  }
  componentWillUnmount() { clearTimeout(this.tt); }
  say(t) { var self = this; clearTimeout(this.tt); this.setState({ toast: t }); this.tt = setTimeout(function () { self.setState({ toast: '' }); }, 2800); }
  open(b, editing) { this.setState({ b: JSON.parse(JSON.stringify(b)), editing: editing || null }); window.scrollTo(0, 0); }
  renderVals() {
    var self = this, st = this.state, D = dvStore(), b = st.b;
    var sigN = window.ADX_SIGNALS ? window.ADX_SIGNALS.list.filter(function (s) { return !s.excluded; }).length : 23;
    function upd(fn) { var nb = JSON.parse(JSON.stringify(self.state.b)); fn(nb); self.setState({ b: nb }); }
    var blank = { id: '', desc: '', mode: 'all', win: 'session', freq: 'once', conds: [{ what: 'scroll_depth', op: 'gt', val: '' }] };
    var out = {
      sigN: sigN, n: D.length, toast: st.toast,
      isEmpty: !b && D.length === 0, hasList: !b && D.length > 0, building: !!b,
      create: function () { self.open(blank); },
      tpls: DV_TPL.map(function (t) { return { id: t.id, page: t.page, rule: dvRule(t), use_for: t.use_for, use: function () { self.open(t); } }; }),
      list: D.map(function (s, i) { return { id: s.id, desc: s.desc || '—', rule: dvRule(s), uses: dvUses(s), edit: function () { self.open(s, i + 1); } }; }),
      b: {}
    };
    if (!b) return out;

    var valid = b.conds.filter(function (c) { var k = dvFind(c.what)[2]; return !dvNeedsVal(k, c.op) || (c.val || '').trim(); });
    var name = (b.id || '').trim();
    var n = valid.length, pct = b.mode === 'all' ? [0, 22, 6, 2.4, 1.1, 0.6][Math.min(n, 5)] : [0, 22, 34, 43, 50, 55][Math.min(n, 5)];
    out.b = {
      title: st.editing ? 'Edit ' + name : 'New derived signal',
      name: b.id, desc: b.desc, idShown: name || 'unnamed_signal',
      onName: function (e) { var v = e.target.value.toLowerCase().replace(/[^a-z0-9_]+/g, '_'); upd(function (x) { x.id = v; }); },
      onDesc: function (e) { var v = e.target.value; upd(function (x) { x.desc = v; }); },
      allOn: b.mode === 'all' ? 'on' : '', anyOn: b.mode === 'any' ? 'on' : '',
      setAll: function () { upd(function (x) { x.mode = 'all'; }); }, setAny: function () { upd(function (x) { x.mode = 'any'; }); },
      conds: b.conds.map(function (c, i) {
        var w = dvFind(c.what), kind = w[2];
        return {
          join: i === 0 ? 'If' : b.mode === 'all' ? 'and' : 'or',
          groups: DV_WHAT.map(function (g) { return { label: g[0], opts: g[1].map(function (o) { return { k: o[0], l: o[1], sel: o[0] === c.what }; }) }; }),
          ops: DV_OPS[kind].map(function (o) { return { k: o[0], l: o[1], sel: o[0] === c.op }; }),
          needsVal: dvNeedsVal(kind, c.op), val: c.val, unit: kind === 'event' ? 'times' : w[3] === '$' ? 'USD' : w[3], ph: kind === 'str' ? 'Foundation' : kind === 'event' ? '3' : w[0] === 'scroll_depth' ? '4000' : '8',
          onWhat: function (e) { var k = e.target.value, nk = dvFind(k)[2]; upd(function (x) { x.conds[i] = { what: k, op: DV_OPS[nk][0][0], val: '' }; }); },
          onOp: function (e) { var v = e.target.value; upd(function (x) { x.conds[i].op = v; }); },
          onVal: function (e) { var v = e.target.value; upd(function (x) { x.conds[i].val = v; }); },
          remove: function () { upd(function (x) { x.conds.splice(i, 1); }); }
        };
      }),
      addCond: function () { upd(function (x) { x.conds.push({ what: 'dwell_time', op: 'gt', val: '' }); }); },
      wins: DV_WIN.map(function (o) { return { k: o[0], l: o[1], sel: o[0] === b.win }; }),
      freqs: DV_FREQ.map(function (o) { return { k: o[0], l: o[1], sel: o[0] === b.freq }; }),
      onWin: function (e) { var v = e.target.value; upd(function (x) { x.win = v; }); },
      onFreq: function (e) { var v = e.target.value; upd(function (x) { x.freq = v; }); },
      sentence: n ? (b.freq === 'once' ? 'Fires once per session when ' : 'Fires every time ') + dvRule({ mode: b.mode, win: b.win, conds: valid }) + '.' : 'Add a condition with a value to see when this fires.',
      uses: dvUses({ conds: valid }), noUses: !n,
      est: n ? '~' + pct + '% of sessions' : '—', estNote: n ? '≈ ' + Math.round(pct * 960).toLocaleString('en-US') + ' sessions a day, based on the last 7 days' : 'Estimate appears once a condition is set',
      cantSave: !name || !n, canDelete: !!st.editing,
      cancel: function () { self.setState({ b: null, editing: null }); },
      del: function () { D.splice(st.editing - 1, 1); self.setState({ b: null, editing: null }); self.say(name + ' deleted'); },
      save: function () {
        var rec = { id: name, desc: (b.desc || '').trim(), mode: b.mode, win: b.win, freq: b.freq, conds: valid };
        if (st.editing) D[st.editing - 1] = rec; else D.push(rec);
        self.setState({ b: null, editing: null }); self.say(name + ' saved to Development · available as a trigger in Experiences');
      }
    };
    return out;
  }
}
</script>
</body>
</html>
