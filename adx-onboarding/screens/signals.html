.site .find{font-size:12px;color:#1b5ed1;text-decoration:underline;margin:10px 0 14px;width:max-content}
.site .del{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.site .del>div{border:1px solid #ddd;border-radius:6px;padding:9px;font-size:11px;line-height:1.35}.del>div.on{border:2px solid #111}
.site .del b{display:block;font-size:11.5px}.del span{color:#666}
.site .add{height:44px;border-radius:999px;background:#cf112c;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:12px}
.site .srch{display:flex;align-items:center;gap:10px;border:2px solid #111;border-radius:999px;padding:11px 18px;font-size:15px}
.site .srch .x{margin-left:auto;color:#999;font-size:18px}
.site .chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;font-size:12px;width:max-content;max-width:100%;padding:2px}
.site .chips b{font-weight:500;border:1px solid #ccc;border-radius:999px;padding:6px 12px}
.site .bk{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px;align-items:start}
.site .card{border:1px solid #e5e5e5;border-radius:6px;padding:14px 16px;background:#fff}
.site .bitem{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #eee;font-size:12px}.bitem:last-child{border-bottom:0}
.site .bt{flex:1;display:flex;flex-direction:column;gap:2px}
.site .promo{display:flex;gap:8px;margin-bottom:12px}.promo .inp{flex:1;border:1px solid #ccc;border-radius:4px;padding:8px 10px;font-size:12px;letter-spacing:.06em}
.site .sum>div{display:flex;justify-content:space-between;font-size:12px;padding:4px 0}.sum .tot{border-top:1px solid #eee;margin-top:6px;padding-top:9px;font-size:13.5px}
.site .co-head{display:flex;align-items:center;gap:16px;padding:16px 28px 16px 42px;border-bottom:1px solid #eee}
.site .lnk{font-size:12.5px;text-decoration:underline}
.site .co .coh{display:flex;align-items:center;gap:9px;font-size:13.5px;margin-bottom:10px}
.site .co .coh i{width:20px;height:20px;border-radius:50%;background:#111;color:#fff;font-style:normal;font-size:11px;display:grid;place-items:center}
.site .fields{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#333;padding-left:29px}
.site .fields.two{flex-direction:row;gap:30px}.fields b{font-weight:500;color:#111}
.site .radios{display:flex;flex-direction:column;gap:7px;padding-left:29px;font-size:12px}
.site .radios span{display:flex;align-items:center;gap:8px}.radios i{width:13px;height:13px;border:1.5px solid #999;border-radius:50%}.radios .on i{border:4px solid #111}
.site .err{margin:10px 0 0 29px;font-size:11.5px;color:#b3261e;background:#fdecea;border-radius:4px;padding:7px 10px}
.site .sx-in{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-size:12px;color:#111;padding:0;-webkit-appearance:none;appearance:none}
.site .sx-in::placeholder{color:#777}
.site .lipimg{background:linear-gradient(180deg,#faf6f3,#f1ebe6)}
.site .lip{display:flex;flex-direction:column;align-items:center;transform:rotate(-8deg)}
.site .lip i{display:block;width:18px;height:30px;border-radius:3px 9px 2px 2px;clip-path:polygon(0 28%,100% 0,100% 100%,0 100%)}
.site .lip b{display:block;width:24px;height:52px;border-radius:3px 3px 4px 4px;box-shadow:inset -5px 0 0 rgba(255,255,255,.12),inset 4px 0 0 rgba(0,0,0,.12);margin-top:-1px}
.fresh{font-size:10px;font-weight:600;color:#3f5f8a;background:#eef2f8;border:1px solid #d6dfec;border-radius:999px;padding:0 6px;white-space:nowrap}
.gpx{position:absolute;width:2.9px;height:2.9px;border-radius:1px;transition:background-color .55s ease}
@property --hunt-a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes huntSpin{to{--hunt-a:360deg}}
.hunt{animation:huntSpin 1.4s linear infinite}
@keyframes wsSpin{to{transform:rotate(360deg)}}
.ws-spin{width:9px;height:9px;box-sizing:border-box;border-radius:50%;border:1.5px solid #bbf7d0;border-top-color:#16a34a;animation:wsSpin .8s linear infinite;flex:none}
@keyframes tagFound{from{box-shadow:0 0 0 0 rgba(22,163,74,.45)}to{box-shadow:0 0 0 7px rgba(22,163,74,0)}}
.found{animation:tagFound .9s ease-out}
@keyframes tagLand{0%{opacity:.3;transform:translateY(-10px);box-shadow:0 0 0 3px rgba(60,140,129,.35)}35%{opacity:1;transform:none}100%{box-shadow:0 0 0 0 rgba(60,140,129,0)}}
.landed{animation:tagLand 1.3s ease-out}
.tg.hit{cursor:pointer}
@keyframes calloutIn{from{opacity:0;transform:translate(10px,6px) scale(.96)}to{opacity:1;transform:none}}



/* ---- Signals (ported from adx-studio Web Signals · Signals) ---- */
.sg-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sg-q{flex:0 1 320px;display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:0 11px;color:var(--muted);box-shadow:var(--shadow)}
.sg-q input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:13.5px;color:var(--ink)}
.sg-sel{height:36px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);font:inherit;font-size:13.5px;color:var(--ink);padding:0 10px;box-shadow:var(--shadow)}
.sg-sp{flex:1}
.sg-tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.sg-row{display:grid;grid-template-columns:minmax(200px,2.2fr) 150px minmax(160px,1.6fr) 90px 110px;align-items:center;gap:14px;padding:12px 18px;border-top:1px solid var(--line);font-size:13.5px;width:100%;box-sizing:border-box;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font-family:inherit;color:inherit;cursor:pointer}
.sg-row:hover{background:var(--surface-2)}
.sg-row.hd{border-top:0;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted);cursor:default}
.sg-row code,.sg-code{font-family:'Geist Mono',ui-monospace,monospace;font-size:12.5px}
.sg-mut{color:var(--muted)}
.sg-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid;white-space:nowrap}
.sg-pill i{width:6px;height:6px;border-radius:50%;display:block;background:currentColor}
.sg-pill.ready{color:#15803d;background:#f0fdf4;border-color:#bbf7d0}
.sg-pill.att{color:#b45309;background:#fffbeb;border-color:#fde68a}
.sg-pill.exc{color:#52525b;background:#f4f4f5;border-color:#e4e4e7}
.sg-env{display:flex;gap:4px}
.sg-env i{font-style:normal;width:20px;height:20px;border-radius:5px;border:1px solid var(--line);display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--faint)}
.sg-env i.on{color:#15803d;background:#f0fdf4;border-color:#bbf7d0}
.sg-none{padding:34px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.sg-none b{color:var(--ink);font-size:14px}
/* detail */
.sg-back{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:13px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;margin-bottom:12px}
.sg-back:hover{color:var(--ink)}
.sg-dh{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.sg-dh h1{font-family:'Geist Mono',ui-monospace,monospace;font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0}
.sg-dh p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.sg-more{position:relative;margin-left:auto}
.sg-menu{position:absolute;right:0;top:40px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px -10px rgba(0,0,0,.25);padding:4px;min-width:170px;display:flex;flex-direction:column}
.sg-menu button{font:inherit;font-size:13px;text-align:left;background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--ink)}
.sg-menu button:hover{background:var(--sink)}
.sg-menu button.danger{color:#dc2626}
.sg-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.sg-ch{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sg-ch b{font-size:14.5px;font-weight:600}
.sg-ch span{font-size:12.5px;color:var(--muted)}
.sg-chain{list-style:none;margin:0;padding:10px 18px 14px}
.sg-chain li{display:flex;gap:12px;position:relative;padding:8px 0}
.sg-chain li:not(:last-child)::before{content:"";position:absolute;left:10px;top:30px;bottom:-8px;width:1px;background:var(--line)}
.sg-ci{flex:0 0 21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;position:relative;z-index:1;background:var(--surface)}
.sg-ci.ok{background:#dcfce7;color:#15803d}
.sg-ci.cur{background:#f97316;color:#fff}
.sg-ci.todo{border:1.5px dashed var(--line-strong)}
.sg-cb{flex:1;min-width:0}
.sg-ct{display:flex;align-items:baseline;gap:12px;min-height:21px}
.sg-ct b{font-size:13.5px;font-weight:600;flex:1}
.sg-ct span{font-size:12.5px;color:var(--muted);text-align:right}
.sg-ct span.cur{color:#ea580c;font-weight:500}
.sg-chain li.todo .sg-ct b{color:var(--faint);font-weight:500}
.sg-iss{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-width:680px;display:flex;flex-direction:column;gap:8px}
.sg-iss .t{font-size:13.5px;font-weight:600}
.sg-iss p{margin:0;font-size:13px;line-height:1.55;color:var(--ink-soft)}
.sg-iss .nx{border-top:1px solid var(--line);padding-top:10px;margin-top:4px;font-size:13px}
.sg-iss .nx span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
.sg-okl{display:flex;align-items:center;gap:8px;margin:0 18px 16px;padding:10px 12px;border-radius:10px;background:#f0fdf4;color:#166534;font-size:13px}
.sg-seg{margin-left:auto;display:inline-flex;background:var(--sink);border:1px solid var(--line);border-radius:9px;padding:2px}
.sg-seg button{font:inherit;font-size:12px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:4px 11px;border-radius:7px;cursor:pointer}
.sg-seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sg-frow{display:grid;grid-template-columns:minmax(160px,2fr) 100px minmax(140px,2fr) 80px;align-items:center;gap:14px;padding:11px 18px;border-top:1px solid var(--line);font-size:13px}
.sg-frow.hd{border-top:0;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted)}
.sg-fw{display:block;font-style:normal;font-size:11.5px;color:#b45309;margin-top:2px}
.sg-sw{width:36px;height:20px;border-radius:999px;border:0;background:var(--line-strong);position:relative;cursor:pointer;padding:0}
.sg-sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .12s}
.sg-sw.on{background:#16a34a}
.sg-sw.on i{left:18px}
.sg-json{margin:0;padding:14px 18px;font-family:'Geist Mono',ui-monospace,monospace;font-size:12.5px;line-height:1.7;background:var(--surface-2);white-space:pre;overflow-x:auto}
.sg-dirty{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:#fffbeb;font-size:13px}
.sg-dirty span{flex:1;min-width:240px}
.sg-mrow{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(150px,1.3fr) minmax(130px,1fr) minmax(160px,1.4fr);align-items:center;gap:14px;padding:12px 18px;border-top:1px solid var(--line);font-size:13px}
.sg-mrow.hd{border-top:0;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted)}
.sg-ms{display:flex;align-items:center;gap:10px}
.sg-ms .lg{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;flex:none}
.sg-sub{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.sg-sub span{text-transform:none;letter-spacing:0;font-weight:400;color:var(--faint)}
.sg-sub .sg-seg{text-transform:none;letter-spacing:0}
.sg-flow{display:flex;align-items:stretch;gap:8px;padding:0 18px 4px;flex-wrap:wrap}
.sg-node{flex:1 1 200px;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;background:var(--surface)}
.sg-node .h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}
.sg-node .h em{font-style:normal;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.sg-node.warn .h em{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
.sg-node.none{border-style:dashed;background:var(--surface-2)}
.sg-node.none .h em{background:var(--sink);color:var(--muted);border-color:var(--line)}
.sg-node .sg-code{white-space:normal;word-break:break-word;line-height:1.5}
.sg-node .m{font-size:12px;color:var(--muted);line-height:1.45}
.sg-arr{align-self:center;color:var(--faint);flex:none}
.sg-vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;padding:0 18px 4px}
.sg-var{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.sg-var .h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sg-var .h b{font-size:13px;font-weight:600}
.sg-var .h span{font-size:11.5px;color:var(--faint)}
.sg-var .m{font-size:11.5px;color:var(--muted)}
.sg-empty{padding:16px 18px;margin:0;font-size:13px;color:var(--muted)}
.sg-modal{position:fixed;inset:0;background:rgba(9,9,11,.4);display:grid;place-items:center;z-index:50;padding:16px}
.sg-modal>div{background:var(--surface);border-radius:14px;max-width:440px;width:100%;padding:20px;box-shadow:0 20px 50px -12px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px}
.sg-modal h3{margin:0;font-size:16px}
.sg-modal p{margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.5}
.sg-toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:#18181b;color:#fafafa;font-size:13px;padding:9px 14px;border-radius:9px;z-index:60;box-shadow:0 10px 24px -8px rgba(0,0,0,.4)}
.sg-spin{width:13px;height:13px;box-sizing:border-box;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sgSpin .8s linear infinite;display:inline-block}
@keyframes sgSpin{to{transform:rotate(360deg)}}
@media(max-width:900px){.sg-row{grid-template-columns:1fr auto}.sg-row>:nth-child(3),.sg-row>:nth-child(4),.sg-row>:nth-child(5){display:none}.sg-frow,.sg-mrow{grid-template-columns:1fr 1fr}}

<sc-if value="{{isList}}">
  <div class="pagehead"><div><div class="eyebrow">ADX Setup</div><h1>Website Signals &amp; Behavior</h1><p>Website behavior captured as signals your experiences can use.</p></div></div>
  <div class="dtabs"><a class="dtab" href="#/web-signals" style="text-decoration:none">Source &amp; mapping</a><button class="dtab on">Signals<span class="tcount">{{total}}</span></button><a class="dtab" href="#/derived" style="text-decoration:none">Derived signals<span class="tcount">{{derivedN}}</span></a></div>

  <div class="sg-tools">
    <label class="sg-q"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3-3"></path></svg><input placeholder="Search {{total}} signals" value="{{q}}" onInput="{{onQ}}" aria-label="Search signals"></label>
    <select class="sg-sel" aria-label="Status" onChange="{{onSt}}"><sc-for list="{{stOpts}}" as="o"><option value="{{o.k}}" selected="{{o.sel}}">{{o.l}}</option></sc-for></select>
    <select class="sg-sel" aria-label="Detected via" onChange="{{onSrc}}"><sc-for list="{{srcOpts}}" as="o"><option value="{{o.k}}" selected="{{o.sel}}">{{o.l}}</option></sc-for></select>
    <span class="sg-sp"></span>
    <a class="btn primary" href="#/web-signals" style="text-decoration:none">Add Signals</a>
  </div>

  <section class="sg-tbl">
    <div class="sg-row hd"><span>Signal</span><span>Status</span><span>Detected via</span><span>Variables</span><span>Environment</span></div>
    <sc-for list="{{list}}" as="s">
      <button type="button" class="sg-row" onClick="{{s.open}}">
        <code>{{s.id}}</code>
        <span><span class="sg-pill {{s.cls}}"><i></i>{{s.status}}</span></span>
        <span class="{{s.viaCls}}">{{s.via}}</span>
        <span>{{s.nVar}}</span>
        <span class="sg-env"><sc-for list="{{s.env}}" as="e"><i class="{{e.c}}" title="{{e.t}}">{{e.l}}</i></sc-for></span>
      </button>
    </sc-for>
    <sc-if value="{{noMatch}}"><div class="sg-none"><b>No signals match</b><span>{{noMatchText}}</span><button class="btn sm" onClick="{{clearF}}">Clear Filters</button></div></sc-if>
  </section>
</sc-if>

<sc-if value="{{isDetail}}">
  <button class="sg-back" onClick="{{back}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Signals</button>
  <div class="sg-dh">
    <div style="min-width:0">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h1>{{d.id}}</h1><span class="sg-pill {{d.cls}}"><i></i>{{d.status}}</span></div>
      <p>{{d.desc}}</p>
    </div>
    <div class="sg-more">
      <button class="btn" onClick="{{d.toggleMenu}}" aria-label="More actions">···</button>
      <sc-if value="{{d.menu}}"><div class="sg-menu"><button onClick="{{d.menuExclude}}">{{d.excludeLabel}}</button><button class="danger" onClick="{{d.askRemove}}">Remove Signal</button></div></sc-if>
    </div>
  </div>

  <section class="sg-card">
    <div class="sg-ch"><b>Objects &amp; variables</b><span>How the website event and tag become this signal</span><sc-if value="{{d.excluded}}"><button class="btn sm" style="margin-left:auto" onClick="{{d.include}}">Include Signal</button></sc-if></div>
    <sc-if value="{{d.excluded}}"><p class="sg-empty" style="padding-bottom:0">Excluded from your signals. Experiences can't use it, and it isn't counted as ready or as needing attention.</p></sc-if>

    <sc-if value="{{d.showIssue}}">
      <div class="sg-iss" style="margin:14px 18px 0;max-width:none">
        <div class="t">{{d.iss.title}}</div>
        <p>{{d.iss.text}}</p>
        <div class="nx"><span>Next step</span>{{d.iss.rec}}</div>
        <div style="display:flex;gap:8px;margin-top:4px">
          <sc-if value="{{d.busy}}"><button class="btn primary" disabled><span class="sg-spin"></span>Checking…</button></sc-if>
          <sc-if value="{{d.idle}}"><button class="btn primary" onClick="{{d.fix}}">{{d.iss.btn}}</button></sc-if>
          <button class="btn ghost" onClick="{{d.askExclude}}">Exclude</button>
        </div>
