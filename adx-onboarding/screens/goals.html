<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding — Your goals</title>
<!-- Styles for this screen only (added while the screen is shown). Fonts are loaded once in index.html. -->
<style>

body{margin:0}
@keyframes obBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes obPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes obSpin{to{transform:rotate(360deg)}}
@keyframes obRing{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
@keyframes obIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes gxBlink{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes aiSp1{0%{transform:scale(.78) rotate(0)}50%{transform:scale(1.06) rotate(45deg)}100%{transform:scale(.78) rotate(90deg)}}
@keyframes aiSp2{0%,100%{opacity:.15;transform:scale(.4)}45%{opacity:1;transform:scale(1.1)}}
.ai-spark{width:20px;height:20px;display:block;overflow:visible}
.ai-spark path{transform-box:fill-box;transform-origin:center}
.ai-spark .s1{animation:aiSp1 1.6s cubic-bezier(.45,0,.25,1) infinite}
.ai-spark .s2{animation:aiSp2 1.6s ease-in-out infinite}
.ai-spark .s3{animation:aiSp2 1.6s ease-in-out .55s infinite}
.gx-caret{width:2px;height:16px;border-radius:1px;background:#18181b;flex:none;animation:gxBlink 1s steps(2) infinite}
@media (prefers-reduced-motion:reduce){.ai-spark path,.gx-caret{animation:none}}

</style>
</head>
<body>
<!-- Markup: Claude Design "DC" template syntax. See CLAUDE.md for the rules. -->
<template data-view>
<div style="min-height: 100vh; background: #fafafa; font-family: Geist, ui-sans-serif, system-ui, -apple-system, sans-serif; color: #09090b; -webkit-font-smoothing: antialiased">

  <header style="position: relative; min-height: 72px; display: flex; align-items: center; justify-content: center; padding: 16px 76px; box-sizing: border-box">
    <div title="Cortex" style="position: absolute; left: 20px; top: 16px; width: 40px; height: 40px; border-radius: 11px; background: #3c8c81; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(60,140,129,0.35)">
      <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path d="M24 7C25 16 32 23 41 24C32 25 25 32 24 41C23 32 16 25 7 24C16 23 23 16 24 7Z" fill="#fff"></path></svg>
    </div>
    <nav aria-label="Onboarding steps" style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center">
      <a href="#/about" style="display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; color: #3f3f46; text-decoration: none"><span style="width: 16px; height: 16px; border-radius: 50%; background: #16a34a; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>About you</a>
      <span aria-hidden="true" style="color: #d4d4d8; letter-spacing: 3px; font-size: 12px">···</span>
      <a href="#/data" style="display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; color: #3f3f46; text-decoration: none"><span style="width: 16px; height: 16px; border-radius: 50%; background: #16a34a; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>Connect your data<span aria-hidden="true" style="display: inline-flex; align-items: center; margin-left: 2px"><span style="box-sizing: border-box; width: 20px; height: 20px; border-radius: 6px; border: 2px solid #fafafa; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 8px; font-weight: 800; letter-spacing: -0.03em; background: #E2412E; z-index: 3" title="Adobe Analytics">Ad</span><span style="box-sizing: border-box; width: 20px; height: 20px; border-radius: 6px; border: 2px solid #fafafa; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 8px; font-weight: 800; letter-spacing: -0.03em; background: #E37400; margin-left: -6px; z-index: 2" title="Google Analytics"><svg width="10" height="10" viewBox="0 0 12 12"><rect x="1" y="6" width="2.6" height="5" rx="1.2" fill="#fff"/><rect x="4.7" y="3.5" width="2.6" height="7.5" rx="1.2" fill="#fff"/><rect x="8.4" y="1" width="2.6" height="10" rx="1.3" fill="#fff"/></svg></span><span style="box-sizing: border-box; width: 20px; height: 20px; border-radius: 6px; border: 2px solid #fafafa; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 8px; font-weight: 800; letter-spacing: -0.03em; background: #2C6BB3; margin-left: -6px; z-index: 1" title="Tealium">Tl</span></span></a>
      <span aria-hidden="true" style="color: #d4d4d8; letter-spacing: 3px; font-size: 12px">···</span>
      <span aria-current="step" style="display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; background: #18181b; color: #fff; box-shadow: 0 4px 14px rgba(24,24,27,0.3)"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg>Your goals</span>
    </nav>
    <div class="shav" style="position: absolute; right: 20px; top: 20px" title="emma.clarke@sephora.com">EC</div>
  </header>

  <main style="max-width: 780px; margin: 0 auto; padding: 40px 24px 110px; box-sizing: border-box; display: flex; flex-direction: column">

    <!-- page header: only once Cortex has finished setting up -->
    <sc-if value="{{ready}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; gap: 16px; align-items: flex-start; margin-bottom: 22px">
      <span aria-hidden="true" style="flex: 0 0 44px; width: 44px; height: 44px; border-radius: 12px; background: #f4f4f5; color: #18181b; border: 1px solid #e4e4e7; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg></span>
      <div style="min-width: 0; flex: 1">
        <h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em">Your goals</h1>
        <p style="margin: 6px 0 0; font-size: 14px; line-height: 1.5; color: #71717a">Pick where ADX should start. Cortex suggests one from your data, and you can choose more or add your own.</p>
      </div>
    </div>
    </sc-if>

    <sc-if value="{{busy}}" hint-placeholder-val="{{true}}">
      <div role="status" aria-live="polite" style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 9vh 0 40px">
        <div aria-hidden="true" style="position: relative; width: 64px; height: 64px; border-radius: 19px; background: #3c8c81; display: grid; place-items: center; margin-bottom: 22px; box-shadow: 0 10px 30px -10px rgba(60,140,129,0.6)">
          <svg viewBox="0 0 48 48" width="26" height="26" style="animation: obPulse 1.5s ease-in-out infinite"><path d="M24 7C25 16 32 23 41 24C32 25 25 32 24 41C23 32 16 25 7 24C16 23 23 16 24 7Z" fill="#fff"></path></svg>
          <span style="position: absolute; inset: -7px; border-radius: 25px; border: 2px solid rgba(60,140,129,0.45); animation: obRing 1.7s ease-out infinite"></span>
        </div>
        <div style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 20px">Cortex is setting up <b style="font-weight: 600; color: #18181b">your goals</b></div>
        <div style="display: flex; flex-direction: column; gap: 10px; min-width: min(420px, 100%); text-align: left">
          <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
            <sc-if value="{{l.show}}" hint-placeholder-val="{{true}}">
              <div style="display: flex; align-items: center; gap: 11px; font-size: 14px; color: {{l.fg}}; animation: obIn .3s ease both">
                <span style="width: 20px; height: 20px; display: grid; place-items: center; flex: none">
                  <sc-if value="{{l.done}}" hint-placeholder-val="{{true}}"><span style="width: 20px; height: 20px; border-radius: 50%; background: #16a34a; color: #fff; display: grid; place-items: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span></sc-if>
                  <sc-if value="{{l.cur}}" hint-placeholder-val="{{false}}"><svg class="ai-spark" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="aiSpG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F5F57"></stop><stop offset="1" stop-color="#3C8C81"></stop></linearGradient></defs><path class="s1" fill="url(#aiSpG)" d="M10.5 4C11 8.6 14.4 12 19 12.5C14.4 13 11 16.4 10.5 21C10 16.4 6.6 13 2 12.5C6.6 12 10 8.6 10.5 4Z"></path><path class="s2" fill="url(#aiSpG)" d="M19 1.5C19.2 3.2 20.3 4.3 22 4.5C20.3 4.7 19.2 5.8 19 7.5C18.8 5.8 17.7 4.7 16 4.5C17.7 4.3 18.8 3.2 19 1.5Z"></path><path class="s3" fill="url(#aiSpG)" d="M19.5 16.5C19.6 17.6 20.4 18.4 21.5 18.5C20.4 18.6 19.6 19.4 19.5 20.5C19.4 19.4 18.6 18.6 17.5 18.5C18.6 18.4 19.4 17.6 19.5 16.5Z"></path></svg></sc-if>
                </span>
                <span>{{l.t}}</span><sc-if value="{{l.caret}}" hint-placeholder-val="{{false}}"><span class="gx-caret" aria-hidden="true"></span></sc-if>
              </div>
            </sc-if>
          </sc-for>
        </div>
        <div style="width: min(420px, 100%); height: 4px; border-radius: 9px; background: #e4e4e7; margin-top: 24px; overflow: hidden">
          <div style="width: {{progress}}; height: 100%; border-radius: 9px; background: linear-gradient(90deg, #18181b, #3c8c81); transition: width 2s linear"></div>
        </div>
      </div>
    </sc-if>

    <!-- goals appear only once Cortex has finished setting up -->
    <sc-if value="{{ready}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; animation: obIn .5s ease both">
    <!-- "Cortex picked Convert" note: hidden for now; return pickNote: true from renderVals() to bring it back -->
    <sc-if value="{{pickNote}}" hint-placeholder-val="{{false}}">
      <div role="status" class="shalert" style="margin-bottom: 14px; align-items: center">
        <svg viewBox="0 0 48 48" width="16" height="16" aria-hidden="true" style="flex: 0 0 auto"><path d="M24 7C25 16 32 23 41 24C32 25 25 32 24 41C23 32 16 25 7 24C16 23 23 16 24 7Z" fill="#3c8c81"></path></svg>
        <span><b style="font-weight: 600; color: #09090b">Cortex read your shopper events</b> and picked <b style="font-weight: 600; color: #09090b">Convert</b> as the best place for Sephora to start. Change it or add more.</span>
      </div>
    </sc-if>

    <!-- North star card: hidden for now; flip to {{true}} to bring it back -->
    <sc-if value="{{false}}">
    <section style="border: 1px solid #e4e4e7; border-radius: 18px; background: #fff; padding: 20px 22px; margin-bottom: 18px">
      <div style="display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap">
        <span aria-hidden="true" style="flex: 0 0 44px; width: 44px; height: 44px; border-radius: 12px; background: #09090b; color: #fafafa; display: flex; align-items: center; justify-content: center">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"></path><path d="M14 7h7v7"></path></svg></span>
        <div style="flex: 1 1 300px; min-width: 0">
          <span style="display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #18181b; margin-bottom: 6px">North star · Customer lifetime value</span>
          <h1 style="margin: 0; font-size: 24px; line-height: 1.25; font-weight: 600; letter-spacing: -0.02em">Everything ADX does is measured against customer lifetime value.</h1>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 16px 0 0 60px">
        <sc-for list="{{strip}}" as="s" hint-placeholder-count="5">
          <span style="display: inline-flex; align-items: center; gap: 6px">
            <span style="font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px; border: 1px solid {{s.bd}}; background: {{s.bg}}; color: {{s.fg}}">{{s.short}}</span>
            <span aria-hidden="true" style="font-size: 12px; color: #a1a1aa">{{s.op}}</span>
          </span>
        </sc-for>
        <b style="font-size: 12px; font-weight: 600; color: #18181b; background: #f4f4f5; border-radius: 999px; padding: 3px 11px">CLV</b>
      </div>
    </section>
    </sc-if>

    <div role="group" aria-label="Goals" aria-busy="{{busyAttr}}" style="display: flex; flex-direction: column; gap: 8px; opacity: {{listOp}}; pointer-events: {{listPe}}; transition: opacity .5s ease">
      <sc-for list="{{goals}}" as="g" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{g.pressed}}" onClick="{{g.toggle}}" style="display: flex; align-items: center; gap: 14px; min-height: 74px; padding: 12px 16px; box-sizing: border-box; text-align: left; border-radius: 12px; background: #fff; font-family: inherit; color: inherit; cursor: pointer; border: 1px solid {{g.bd}}; box-shadow: {{g.ring}}">
          <span style="flex: 0 0 38px; width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: {{g.icBg}}; color: {{g.icFg}}">
            <sc-if value="{{g.isDropoff}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg></sc-if>
            <sc-if value="{{g.isConvert}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 7H6"></path></svg></sc-if>
            <sc-if value="{{g.isRevenue}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path><rect x="3" y="3" width="18" height="18" rx="3"></rect></svg></sc-if>
            <sc-if value="{{g.isReturns}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h13a5 5 0 0 1 0 10H8"></path><path d="M7 3 3 7l4 4"></path></svg></sc-if>
            <sc-if value="{{g.isService}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path><path d="m9 12 2 2 4-4"></path></svg></sc-if>
          </span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
              <span style="font-size: 12px; font-weight: 500; color: #71717a">{{g.move}}</span>
              <sc-if value="{{g.suggested}}" hint-placeholder-val="{{false}}">
                <span class="shbadge sec">
                  <svg viewBox="0 0 48 48" width="11" height="11" aria-hidden="true"><path d="M24 7C25 16 32 23 41 24C32 25 25 32 24 41C23 32 16 25 7 24C16 23 23 16 24 7Z" fill="#3C8C81"></path></svg>Suggested for Sephora</span>
              </sc-if>
            </span>
            <b style="font-size: 14px; font-weight: 600; line-height: 1.3">{{g.label}}</b>
          </span>
          <span class="shck" data-state="{{g.ckState}}" style="width: 20px; height: 20px; font-size: 12px; font-weight: 500">{{g.rank}}</span>
        </button>
      </sc-for>
    </div>

    <section class="shcard" style="padding: 20px; margin-top: 16px">
      <label for="obGoalIn" class="shl">Add your own goal</label>
      <div style="display: flex; gap: 9px; margin-top: 8px; flex-wrap: wrap">
        <input id="obGoalIn" class="shi" maxlength="90" value="{{draft}}" onChange="{{onDraft}}" placeholder="e.g. Increase newsletter sign-ups from first-time visitors" style="flex: 1 1 280px; width: auto">
        <button type="button" class="shb out" onClick="{{addGoal}}">Add goal</button>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px">
        <sc-for list="{{custom}}" as="c" hint-placeholder-count="0">
          <span class="shbadge sec" style="gap: 6px; padding: 2px 4px 2px 8px; font-size: 14px; line-height: 20px">{{c.t}}
            <button type="button" onClick="{{c.remove}}" aria-label="Remove {{c.t}}" style="width: 20px; height: 20px; border: 0; border-radius: 4px; background: transparent; color: #71717a; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
          </span>
        </sc-for>
      </div>
    </section>

    <div style="display: flex; align-items: center; gap: 12px; margin-top: 26px; flex-wrap: wrap">
      <a href="#/data" class="shb ghost lg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Back</a>
      <sc-if value="{{hasGoals}}" hint-placeholder-val="{{true}}">
        <a href="#/home" class="shb pri lg">{{ctaLabel}}
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
      </sc-if>
      <sc-if value="{{busy}}" hint-placeholder-val="{{false}}">
        <button type="button" class="shb pri lg" disabled>Setting up…</button>
      </sc-if>
      <sc-if value="{{noGoals}}" hint-placeholder-val="{{false}}">
        <button type="button" class="shb pri lg" disabled>Pick at least one</button>
      </sc-if>
      <span style="font-size: 12px; color: #71717a">Step 3 of 3 · all measured against CLV</span>
    </div>
    </div>
    </sc-if>

  </main>
</div>
</template>
<script type="text/x-dc">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // step 0-2: Cortex setting up (one line each, typed out), 3: all lines done (brief pause), 4: goals shown with Convert pre-picked
    this.state = { step: 0, typed: 0, order: [], custom: [], draft: '' };
  }
  componentDidMount() {
    var self = this, LINES = this.lines(), PER = 2000;
    // each line types out with a caret, then turns into a tick as the next one starts
    function line(i) {
      if (i >= LINES.length) { self.setState({ step: LINES.length }); self.timer = setTimeout(function () { self.setState({ step: 4, order: self.state.order.length ? self.state.order : ['convert'] }); }, 350); return; }
      var text = LINES[i], typeMs = Math.min(1100, text.length * 28), gap = Math.max(14, Math.round(typeMs / text.length)), c = 0;
      self.setState({ step: i, typed: 0 });
      (function type() { c += 1; self.setState({ typed: c }); if (c < text.length) self.typer = setTimeout(type, gap); })();
      self.timer = setTimeout(function () { line(i + 1); }, PER);
    }
    line(0);
  }
  componentWillUnmount() { clearTimeout(this.timer); clearTimeout(this.typer); }
  lines() { return ['Saving your data connections', 'Reading your shopper events', 'Finding goals that fit Beauty & Cosmetics']; }
  renderVals() {
    var self = this;
    var order = this.state.order;
    var defs = [
      { id: 'dropoff', short: 'Save', move: 'Save', label: "Rescue orders before they're lost" },
      { id: 'convert', short: 'Convert', move: 'Convert', label: 'Convert visitors into buyers' },
      { id: 'revenue', short: 'Grow', move: 'Grow', label: 'Sell more in every order' },
      { id: 'returns', short: 'Keep', move: 'Keep', label: 'Help shoppers choose right the first time' },
      { id: 'service', short: 'Assist', move: 'Assist', label: 'Answer questions before they become tickets' }
    ];
    var goals = defs.map(function (g) {
      var idx = order.indexOf(g.id), on = idx >= 0;
      return {
        move: g.move, label: g.label, suggested: g.id === 'convert' && self.state.step >= 3,
        isDropoff: g.id === 'dropoff', isConvert: g.id === 'convert', isRevenue: g.id === 'revenue', isReturns: g.id === 'returns', isService: g.id === 'service',
        pressed: on ? 'true' : 'false',
        bd: on ? '#18181b' : '#e4e4e7', ring: on ? '0 0 0 3px #f4f4f5' : 'none',
        icBg: on ? '#18181b' : '#f4f4f5', icFg: on ? '#fff' : '#3f3f46',
        tickBd: on ? '#18181b' : '#d4d4d8', tickBg: on ? '#18181b' : 'transparent',
        rank: on ? String(idx + 1) : '', ckState: on ? 'checked' : 'unchecked',
        toggle: function () {
          var o = self.state.order.slice(), i = o.indexOf(g.id);
          if (i >= 0) o.splice(i, 1); else o.push(g.id);
          self.setState({ order: o });
        }
      };
    });
    var strip = defs.map(function (g, i) {
      var on = order.indexOf(g.id) >= 0;
      return { short: g.short, op: i === defs.length - 1 ? '=' : '+', bd: on ? '#09090b' : '#e4e4e7', bg: on ? '#09090b' : '#fff', fg: on ? '#fafafa' : '#71717a' };
    });
    var custom = this.state.custom.map(function (t, i) {
      return { t: t, remove: function () { var c = self.state.custom.slice(); c.splice(i, 1); self.setState({ custom: c }); } };
    });
    var n = order.length + this.state.custom.length, step = this.state.step, busy = step < 4;
    var lines = this.lines(), typed = this.state.typed;
    return {
      busy: busy, ready: !busy, busyAttr: busy ? 'true' : 'false', listOp: busy ? '0.45' : '1', listPe: busy ? 'none' : 'auto',
      progress: Math.round(Math.min(step + 1, lines.length) / lines.length * 100) + '%',
      lines: lines.map(function (t, i) {
        var done = i < step, cur = i === step;
        return { t: cur ? t.slice(0, typed) : t, done: done, cur: cur, show: done || cur, caret: cur && typed < t.length, fg: cur ? '#09090b' : '#71717a' };
      }),
      goals: goals, strip: strip, custom: custom,
      draft: this.state.draft,
      onDraft: function (e) { self.setState({ draft: e.target.value }); },
      addGoal: function () {
        var v = (self.state.draft || '').trim();
        if (!v || self.state.custom.indexOf(v) >= 0) return;
        self.setState({ custom: self.state.custom.concat([v]), draft: '' });
      },
      hasGoals: !busy && n > 0, noGoals: !busy && n === 0,
      ctaLabel: 'Focus on ' + n + ' lever' + (n > 1 ? 's' : '')
    };
  }
}
</script>
