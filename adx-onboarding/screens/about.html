<!-- Markup: Claude Design "DC" template syntax. See CLAUDE.md for the rules. -->
<template data-view>
<div style="min-height: 1120px; background: #fafafa; font-family: Geist, ui-sans-serif, system-ui, -apple-system, sans-serif; color: #09090b; -webkit-font-smoothing: antialiased">

  <header style="position: relative; min-height: 72px; display: flex; align-items: center; justify-content: center; padding: 16px 76px; box-sizing: border-box">

      <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path d="M24 7C25 16 32 23 41 24C32 25 25 32 24 41C23 32 16 25 7 24C16 23 23 16 24 7Z" fill="#fff"></path></svg>
    </div>
    <nav aria-label="Onboarding steps" style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center">
      <span aria-current="step" style="display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; background: #18181b; color: #fff; box-shadow: 0 4px 14px rgba(24,24,27,0.3)"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg>About you</span>
      <span aria-hidden="true" style="color: #d4d4d8; letter-spacing: 3px; font-size: 12px">···</span>
      <span style="display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; color: #71717a"><span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #d4d4d8; font-size: 11px; display: flex; align-items: center; justify-content: center">2</span>Connect your data<span aria-hidden="true" style="display: inline-flex; align-items: center; margin-left: 2px"><span style="box-sizing: border-box; width: 20px; height: 20px; border-radius: 6px; border: 2px solid #fafafa; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 8px; font-weight: 800; letter-spacing: -0.03em; background: #E2412E; z-index: 3" title="Adobe Analytics">Ad</span><span style="box-sizing: border-box; width: 20px; height: 20px; border-radius: 6px; border: 2px solid #fafafa; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 8px; font-weight: 800; letter-spacing: -0.03em; background: #E37400; margin-left: -6px; z-index: 2" title="Google Analytics"><svg width="10" height="10" viewBox="0 0 12 12"><rect x="1" y="6" width="2.6" height="5" rx="1.2" fill="#fff"></rect><rect x="4.7" y="3.5" width="2.6" height="7.5" rx="1.2" fill="#fff"></rect><rect x="8.4" y="1" width="2.6" height="10" rx="1.3" fill="#fff"></rect></svg></span><span style="box-sizing: border-box; width: 20px; height: 20px; border-radius: 6px; border: 2px solid #fafafa; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 8px; font-weight: 800; letter-spacing: -0.03em; background: #2C6BB3; margin-left: -6px; z-index: 1" title="Tealium">Tl</span></span></span>
      <span aria-hidden="true" style="color: #d4d4d8; letter-spacing: 3px; font-size: 12px">···</span>
      <span style="display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; color: #71717a"><span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #d4d4d8; font-size: 11px; display: flex; align-items: center; justify-content: center">3</span>Your goals</span>
    </nav>
    <div style="position: absolute; right: 20px; top: 20px; width: 32px; height: 32px; border-radius: 50%; background: #9bdb72; color: #1f4d14; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center" title="emma.clarke@sephora.com">EC</div>
  </header>

  <main style="max-width: 780px; margin: 0 auto; padding: 40px 24px 110px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; gap: 16px; align-items: flex-start; margin-bottom: 8px">
      <span aria-hidden="true" style="flex: 0 0 44px; width: 44px; height: 44px; border-radius: 12px; background: #f4f4f5; color: #18181b; border: 1px solid #e4e4e7; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>
      <div style="min-width: 0; flex: 1">
        <h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em">Welcome to ADX, Emma!</h1>
        <p style="margin: 6px 0 0; font-size: 14.5px; line-height: 1.5; color: #71717a">We pulled the basics from LinkedIn and ZoomInfo. Confirm them and add two details about the business you're building for.</p>
      </div>
    </div>

    <section style="border: 1px solid #e4e4e7; border-radius: 18px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.05); padding: 22px 24px">
      <h2 style="margin: 0 0 3px; font-size: 15px; font-weight: 600">Your business</h2>
      <p style="margin: 0 0 18px; font-size: 13px; line-height: 1.5; color: #71717a">Cortex reads your site to learn your catalog, brand voice and seasonality. Industry picks the right starting experiences and mock data.</p>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 14px">
        <div style="display: flex; flex-direction: column">
          <label for="obInd" style="font-size: 12px; font-weight: 600; color: #3f3f46; margin-bottom: 7px"><span style="color: #dc2626; margin-right: 3px">*</span>Industry</label>
          <div style="position: relative; display: flex">
            <select id="obInd" style="appearance: none; -webkit-appearance: none; width: 100%; box-sizing: border-box; border: 1px solid #d4d4d8; border-radius: 11px; padding: 12px 38px 12px 13px; font-family: inherit; font-size: 13.5px; font-weight: 500; color: #09090b; background: #fff; cursor: pointer">
              <sc-for list="{{industries}}" as="i" hint-placeholder-count="8">
                <option selected="{{i.sel}}">{{i.n}}</option>
              </sc-for>
            </select>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 13px; top: 14px; color: #71717a; pointer-events: none" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
          </div>
        </div>
        <div style="display: flex; flex-direction: column">
          <label for="obWeb" style="font-size: 12px; font-weight: 600; color: #3f3f46; margin-bottom: 7px"><span style="color: #dc2626; margin-right: 3px">*</span>Website URL</label>
          <div style="display: flex; align-items: stretch; border: 1px solid #d4d4d8; border-radius: 11px; background: #fff; overflow: hidden">
            <span style="display: flex; align-items: center; padding: 0 11px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #71717a; background: #fafafa; border-right: 1px solid #e4e4e7">https://</span>
            <input id="obWeb" inputmode="url" value="sephora.com" placeholder="yourstore.com" style="flex: 1; min-width: 0; border: 0; outline: none; padding: 12px 13px; font-family: inherit; font-size: 13.5px; color: #09090b; background: transparent">
          </div>
          <div style="display: flex; gap: 6px; align-items: flex-start; margin-top: 7px; font-size: 11.5px; line-height: 1.45; color: #71717a">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto; margin-top: 2px" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
            <span>Matched from your company profile. Change it to the storefront you're building for.</span>
          </div>
        </div>
      </div>
    </section>

    <section aria-live="polite" style="border: 1px solid #e4e4e7; border-radius: 18px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.05); padding: 18px 24px 22px">
      <div style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; margin-bottom: 12px">
        <span style="width: 22px; height: 22px; border-radius: 50%; background: #16a34a; color: #fff; display: flex; align-items: center; justify-content: center">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
        Research complete
      </div>
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{research}}" as="r" hint-placeholder-count="3">
          <div style="display: flex; gap: 14px; font-size: 14px; color: #3f3f46; line-height: 1.55; padding-bottom: {{r.pad}}">
            <span style="flex: 0 0 20px; display: flex; flex-direction: column; align-items: center">
              <span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #d4d4d8; background: #fff; display: flex; align-items: center; justify-content: center; margin-top: 1px"><span style="width: 5px; height: 5px; border-radius: 50%; background: #a1a1aa; display: block"></span></span>
              <span style="flex: 1; width: 1px; background: {{r.line}}; margin-top: 3px"></span>
            </span>
            <span>{{r.t}}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="border: 1px solid #e4e4e7; border-radius: 18px; background: #fff">
      <div style="padding: 14px 20px 0; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #71717a">Signed in as</div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 20px 16px; flex-wrap: wrap">
        <div aria-hidden="true" style="flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%; background: #9bdb72; color: #1f4d14; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">EC</div>
        <div style="min-width: 0; flex: 1">
          <div style="font-size: 15px; font-weight: 600">Emma Clarke</div>
          <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 2px; font-size: 13px">
            <button type="button" aria-haspopup="listbox" style="display: inline-flex; align-items: center; gap: 6px; font-family: inherit; font-size: 13px; color: #71717a; padding: 3px 8px; margin-left: -8px; border: 0; border-radius: 7px; background: transparent; cursor: pointer">Sales Director, East Europe
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
            <span style="display: inline-flex; align-items: center; gap: 7px; font-weight: 600"><span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 6px; background: #fff; border: 1px solid #e4e4e7; display: flex; align-items: center; justify-content: center"><img src="assets/logos/sephora.com.png" alt="" width="16" height="16" style="display: block; filter: invert(1)"></span>Sephora</span>
            <span style="display: inline-flex; align-items: center; gap: 5px; color: #71717a">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path></svg>East Europe market</span>
          </div>
        </div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap; align-self: flex-start">
          <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: #71717a; background: #fafafa; border: 1px solid #e4e4e7; border-radius: 999px; padding: 3px 9px"><b style="width: 14px; height: 14px; border-radius: 4px; background: #0a66c2; color: #fff; font-size: 8.5px; display: flex; align-items: center; justify-content: center; font-weight: 800">in</b>LinkedIn</span>
          <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: #71717a; background: #fafafa; border: 1px solid #e4e4e7; border-radius: 999px; padding: 3px 9px"><b style="width: 14px; height: 14px; border-radius: 4px; background: #e2412e; color: #fff; font-size: 8.5px; display: flex; align-items: center; justify-content: center; font-weight: 800">Z</b>ZoomInfo</span>
        </div>
      </div>
    </section>

    <div style="display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap">
      <a href="#/data" style="height: 48px; padding: 0 26px; border-radius: 999px; background: #09090b; color: #fafafa; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 9px; text-decoration: none">Continue
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
      <span style="font-size: 12.5px; color: #71717a">Step 1 of 3 · about 2 minutes total</span>
    </div>

  </main>
</div>
</template>
<script type="text/x-dc">
class Component extends DCLogic {
  renderVals() {
    var inds = ['Beauty & Cosmetics', 'Fashion & Apparel', 'Consumer Electronics', 'Home & Living', 'Health & Wellness', 'Grocery & Gourmet', 'Travel & Hospitality', 'Sporting Goods'];
    var research = [
      'Sephora, part of LVMH, sells makeup, skincare, fragrance and haircare from hundreds of brands alongside its own Sephora Collection.',
      'Sephora sells online and through its stores across Europe, the Americas, the Middle East and Asia, with a loyalty programme at the centre of its CRM.',
      "As Sales Director for East Europe, you're likely focused on regional growth, conversion and a localized shopping experience."
    ];
    return {
      industries: inds.map(function (n, i) { return { n: n, sel: i === 0 }; }),
      research: research.map(function (t, i) {
        var last = i === research.length - 1;
        return { t: t, pad: last ? '0' : '14px', line: last ? 'transparent' : '#e4e4e7' };
      })
    };
  }
}
</script>
</body>
</html>
