body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
* { box-sizing: border-box; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; margin: 0px; letter-spacing: -0.02em; text-wrap: balance; }
button { font-family: inherit; cursor: pointer; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; background: none; color: inherit; }
.rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0px; padding: 14px 12px; gap: 2px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; }
.brand .glyph { width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto; background: rgb(0, 0, 0); position: relative; box-shadow: rgba(0, 0, 0, 0.18) 0px 1px 3px; object-fit: cover; display: block; }
.brand b { font-family: var(--f-display); font-weight: 600; font-size: 14.5px; letter-spacing: -0.02em; line-height: 1.15; display: block; }

.rail-nav { display: flex; flex-direction: column; }
.nav-cat { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; cursor: pointer; font-family: inherit; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 15px 10px 7px; }

.subnav-item::before { content: ""; position: absolute; left: -12px; top: 50%; transform: translateY(-50%); width: 7px; height: 1px; background: var(--line); }

.subnav-item .sub-ico svg { width: 16px; height: 16px; display: block; }
.subnav-item:hover { background: var(--sink); color: var(--ink); }

.subnav-item.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }

.subnav-item.on .sub-ico { color: var(--accent); }

.nc-ico { width: 22px; height: 22px; flex: 0 0 auto; color: var(--muted); display: none; place-items: center; }
.nc-ico svg { width: 19px; height: 19px; }
.flyout-title { display: none; }
.rail-toggle { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--muted); flex: 0 0 auto; }
.rail-toggle:hover { background: var(--sink); color: var(--ink); }
.rail-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.rail-foot .av { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, rgb(233, 162, 59), rgb(217, 104, 59)); color: rgb(255, 255, 255); font-size: 11px; font-weight: 600; display: grid; place-items: center; flex: 0 0 auto; font-family: var(--f-display); }
.rail-foot .who b { font-size: 12.5px; font-weight: 600; display: block; line-height: 1.2; }
.rail-foot .who span { font-size: 11px; color: var(--muted); }
.topbar { height: 56px; flex: 0 0 auto; display: flex; align-items: center; gap: 14px; padding: 0px 22px; border-bottom: 1px solid var(--line); background: var(--surface); }
.menu-btn { display: none; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); align-items: center; justify-content: center; }
.crumb { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.crumb b { color: var(--ink); font-weight: 600; }
.env { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; background: var(--surface-2); }
.env .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 9px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0px 15px; border-radius: var(--radius-sm); font-weight: 500; font-size: 13.5px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: background 0.12s, border-color 0.12s, box-shadow 0.12s, color 0.12s; white-space: nowrap; box-shadow: var(--shadow); }
.btn:hover { background: var(--sink); }
.btn:active { transform: translateY(0.5px); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-soft); box-shadow: none; }
.btn.ghost:hover { background: var(--sink); color: var(--ink); }
.btn.sm { height: 30px; padding: 0px 11px; font-size: 12.5px; border-radius: calc(var(--radius-sm) - 2px); }
.btn .ico { width: 15px; height: 15px; }
.pagehead { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
.pagehead .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
.pagehead h1 { font-size: 25px; line-height: 1.1; }
.pagehead p { margin: 7px 0px 0px; color: var(--muted); max-width: 60ch; font-size: 13.5px; }
.dtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 4px 0px 22px; overflow-x: auto; }
.dtab { appearance: none; border-width: medium medium 2px; border-style: none none solid; border-color: currentcolor currentcolor transparent; border-image: none; background: none; font-style: inherit; font-variant: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 13.5px; font-weight: 500; color: var(--muted); white-space: nowrap; padding: 10px 15px; cursor: pointer; margin-bottom: -1px; transition: color 0.12s; }
.dtab:hover { color: var(--ink-soft); }
.dtab.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.dtab .tcount { font-size: 11px; font-weight: 600; color: var(--faint); margin-left: 6px; }
.rail .nav-cat-group, .rail .nav-sub { border-left-width: medium !important; border-left-style: none !important; border-left-color: currentcolor !important; margin-left: 0px !important; padding-left: 0px !important; }
.rail .subnav-item::before { display: none !important; }

.rail-setup { margin-top: auto; padding-top: 12px; }
.rail-setup + .rail-foot { margin-top: 10px; }
.setup-wrap { display: flex; flex-direction: column-reverse; background: rgb(24, 24, 27); border: 1px solid rgb(39, 39, 42); border-radius: 12px; padding: 4px; box-shadow: rgba(0, 0, 0, 0.45) 0px 6px 18px -8px; }

                    <div style="display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--ink-soft)">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:0 0 auto;margin-top:2px"><path d="M20 6 9 17l-5-5"></path></svg>
                      <span><b style="font-weight:600;color:var(--ink)">{{pickedName}} is covered by the Adobe account you connected during onboarding.</b> No extra login or token needed. Cortex reads it with the same read-only access.</span>
                    </div>
                    <label style="display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;color:var(--ink-soft)">Instance
                      <select style="height:36px;min-width:260px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-family:inherit;font-size:13px;background:var(--surface)"><option>sephora.com — Production (detected)</option><option>sephora.com — Staging</option></select>
                    </label>
                    <div><button class="btn primary" onClick="{{startConnect}}">Add {{pickedName}}</button></div>
                  </div>
                </sc-if>
                <sc-if value="{{needsForm}}" hint-placeholder-val="{{false}}">
                  <div style="border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:14px">
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px">
                      <sc-for list="{{fields}}" as="f" hint-placeholder-count="3">
                        <label style="display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-soft)"><span>{{f.label}} <span style="font-weight:400;color:var(--faint)">{{f.hint}}</span></span>
                          <input type="{{f.type}}" placeholder="{{f.ph}}" style="height:38px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-family:var(--f-mono, ui-monospace, monospace);font-size:13px;background:var(--surface);color:var(--ink)"></label>
                      </sc-for>
                    </div>
                    <div style="font-size:12px;color:var(--muted)">Read-only access. Credentials are encrypted and kept for this session only.</div>
                    <div><button class="btn primary" onClick="{{startConnect}}">Save &amp; connect</button></div>
                  </div>
                </sc-if>
              </div>
            </sc-if>

            <sc-if value="{{showCsv}}" hint-placeholder-val="{{false}}">
              <div style="display:flex;flex-direction:column;gap:10px">
                <button type="button" onClick="{{startCsv}}" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 16px;border:1.5px dashed #d4d4d8;border-radius:12px;background:var(--surface)">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4"></path><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path></svg>
                  <b style="font-size:14px;font-weight:600">{{csv.title}}</b>
                  <span style="font-size:12.5px;color:var(--muted)">or <u>choose a file</u> · up to 200 MB</span>
                </button>
                <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap"><span>{{csv.needs}}</span><a href="#template" style="font-weight:600;color:var(--ink-soft)">Download template</a></div>
              </div>
            </sc-if>

            <sc-if value="{{showMock}}" hint-placeholder-val="{{false}}">
              <div style="border:1px solid rgba(60,140,129,0.3);border-radius:12px;background:linear-gradient(135deg,#f1f7f6,#fff 70%);padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
                <span style="flex:1;min-width:220px;font-size:13px;color:var(--ink-soft)"><b style="font-weight:600;color:var(--ink)">Sephora · {{title}} pack</b><br>{{mockInfo}}</span>
                <button class="btn primary sm" onClick="{{useMock}}">Use mock data</button>
              </div>
            </sc-if>
          </div>
        </sc-if>
      </div>

      <!-- coverage + sample -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:12px;margin-top:12px;align-items:start">
        <div class="card" style="padding:16px 18px;display:flex;flex-direction:column;gap:10px">
          <b style="font-size:13px;font-weight:600">What Cortex knows</b>
          <sc-for list="{{coverage}}" as="c" hint-placeholder-count="6">
            <div style="display:grid;grid-template-columns:minmax(120px,1fr) 90px 44px;align-items:center;gap:10px">
              <span style="font-size:12.5px;color:var(--ink-soft);display:flex;flex-direction:column"><span>{{c.name}}</span><span style="font-size:11px;color:var(--faint)">{{c.src}}</span></span>
              <span style="height:6px;border-radius:4px;background:var(--sink);overflow:hidden;display:block"><span style="display:block;height:100%;border-radius:4px;background:{{c.bar}};width:{{c.w}}"></span></span>
              <span style="font-size:12px;font-weight:600;text-align:right;color:{{c.fg}}">{{c.pct}}</span>
            </div>
          </sc-for>
        </div>
        <div class="card" style="padding:0;overflow:hidden">
          <div style="padding:16px 18px 10px"><b style="font-size:13px;font-weight:600">{{sample.title}}</b></div>
          <div style="overflow-x:auto">
            <table style="width:100%;border-collapse:collapse;font-size:12.5px">
              <thead><tr><sc-for list="{{sample.cols}}" as="h" hint-placeholder-count="5"><th style="text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:8px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap">{{h.t}}</th></sc-for></tr></thead>
              <tbody>
                <sc-for list="{{sample.rows}}" as="r" hint-placeholder-count="6">
                  <tr><sc-for list="{{r.cells}}" as="v" hint-placeholder-count="5"><td style="padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;color:{{v.fg}};font-weight:{{v.w}}">{{v.t}}</td></sc-for></tr>
                </sc-for>
              </tbody>
            </table>
          </div>
        </div>
      </div>
</div>
</div>
</div>
</template>
<script type="text/x-dc">
// Product Catalog: Adobe Analytics gave product IDs, names and categories during onboarding; a commerce source adds prices, stock and variants
var PAGE = {
  title: 'Product Catalog', unit: 'products', total: 21384,
  lede: 'Your products, variants, prices and stock. Cortex uses them for recommendations, size and shade guidance, and answers about products.',
  baseHead: '18,962 products pulled from Adobe Analytics.',
  baseBody: 'Inferred from product views during onboarding. Prices, stock and variants are missing, so add a commerce source to fill them in.',
  cta: 'Add a commerce source',
  fullHead: '21,384 products and variants from {src}.', fullBody: 'Adobe Analytics still adds view counts. Synced just now · refreshes every 6 hours.',
  baseWhat: 'Product IDs, names and categories from product views',
  baseStats: [[18962, 'products found'], [5, 'top categories'], ['—', 'prices'], ['—', 'stock levels']],
  fullStats: [[21384, 'products & variants'], [5, 'top categories'], [312, 'brands'], ['94%', 'with prices & stock']],
  vis: { segTitle: 'Products by category', segs: [['Skincare', 34], ['Makeup', 31], ['Fragrance', 15], ['Hair', 12], ['Bath & body', 8]],
    listTitle: 'Top brands', list: [['Sephora Collection', 1240], ['Fenty Beauty', 410], ['Rare Beauty', 388], ['Charlotte Tilbury', 356], ['Dior', 342]] },
  coverage: [['Product ID & name', 100, 100], ['Category', 96, 100], ['Brand', 92, 100], ['Price', 0, 94], ['Stock level', 0, 94], ['Variants (shade, size)', 0, 88], ['Images', 61, 99]],
  tiles: [
    { name: 'Adobe Commerce', kind: 'Products, prices, stock & categories', mono: 'Ac', c: '#E2412E', adobe: true, linked: 'Linked to store view sephora_us', fields: [] },
    { name: 'Shopify', kind: 'Products, variants & inventory', mono: 'S', c: '#5E8E3E', linked: 'Linked to sephora.myshopify.com',
      fields: [['Shop domain', '', 'your-store.myshopify.com', 'text'], ['Admin API access token', '', 'shpat_…', 'password']] },
    { name: 'commercetools', kind: 'Product projections & prices', mono: 'ct', c: '#213C8F', linked: 'Linked to project sephora-prod',
      fields: [['Project key', '', 'sephora-prod', 'text'], ['Region', '', 'europe-west1.gcp', 'text'], ['Client ID', '', 'client id', 'text'], ['Client secret', '', 'Paste your client secret', 'password']] },
    { name: 'Salesforce Commerce Cloud', kind: 'Catalog & price books', mono: 'CC', c: '#0B76D0', linked: 'Linked to site Sephora-US',
      fields: [['Instance URL', '', 'https://your-instance.commercecloud.salesforce.com', 'text'], ['Client ID', '', 'client id', 'text'], ['Client secret', '', 'Paste your client secret', 'password']] }
  ],
  csv: { title: 'Drop a product feed (CSV) here', file: 'sephora_products.csv', size: '38 MB · 21,384 rows', mapped: '14 columns mapped: SKU, name, brand, price, stock, shade…',
    needs: 'Needs a SKU, product name and price. Cortex maps the rest.' },
  mock: '21K products, 5 categories, 300+ brands',
  sample: { title: 'Sample products',
    cols: ['Product', 'Brand', 'Category', 'Price', 'Stock', 'Views (14d)'],
    rows: [
      ["Pro Filt'r Soft Matte Foundation", 'Fenty Beauty', 'Makeup', ['—', '$40.00'], ['—', '50 shades · in stock'], '12.4K'],
      ['Soft Pinch Liquid Blush', 'Rare Beauty', 'Makeup', ['—', '$23.00'], ['—', 'Low stock'], '9.8K'],
      ['Pillow Talk Matte Lipstick', 'Charlotte Tilbury', 'Makeup', ['—', '$35.00'], ['—', 'In stock'], '8.1K'],
      ['Protini Polypeptide Cream', 'Drunk Elephant', 'Skincare', ['—', '$68.00'], ['—', 'In stock'], '6.9K'],
      ['No. 3 Hair Perfector', 'Olaplex', 'Hair', ['—', '$30.00'], ['—', 'In stock'], '5.2K'],
      ['Sauvage Eau de Toilette', 'Dior', 'Fragrance', ['—', '$105.00'], ['—', 'Out of stock'], '4.7K']
    ] }
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    // base = what Cortex inferred from analytics during onboarding; added = sources added on this page
    this.state = { addOpen: false, mode: 'connect', pick: null, added: [], run: null };
  }
  componentWillUnmount() { clearInterval(this.timer); }
  // checking → connecting → bringing in data (or uploading → mapping → bringing in data for a CSV)
  run(kind, src) {
    var self = this, t0 = Date.now();
    clearInterval(this.timer);
    this.setState({ run: { kind: kind, src: src, stage: 0, pct: 0 } });
    this.timer = setInterval(function () {
      var ms = Date.now() - t0, stage = ms < 1300 ? 0 : ms < 2600 ? 1 : 2;
      var pct = stage < 2 ? 0 : Math.min(100, Math.round((ms - 2600) / 30));
      if (pct >= 100) {
        clearInterval(self.timer);
        self.setState({ run: null, pick: null, addOpen: false, added: self.state.added.concat([src]) });
      } else self.setState({ run: { kind: kind, src: src, stage: stage, pct: pct } });
    }, 120);
  }
  renderVals() {
    var self = this, st = this.state, D = PAGE;
    var full = st.added.length > 0, run = st.run;
    function fmt(n) { return typeof n === 'number' ? n.toLocaleString('en-US') : n; }
    var RAMP = ['#18181b', '#3c8c81', '#7fb8b0', '#bfdcd8', '#e4e4e7'];
    var firstAdded = st.added[0], addedName = firstAdded ? firstAdded.name : '';

    var stx = full
      ? { label: 'Connected', fg: '#15803d', bg: '#f0fdf4', bd: '#bbf7d0', head: D.fullHead.replace('{src}', addedName), body: D.fullBody, hasCta: false, cta: '' }
      : { label: 'Partial', fg: '#b45309', bg: '#fffbeb', bd: '#fde68a', head: D.baseHead, body: D.baseBody, hasCta: true, cta: D.cta };

    var vis = full && D.visFull ? D.visFull : D.vis;
    var max = Math.max.apply(null, vis.list.map(function (x) { return x[1]; }));

    var sources = [{ name: 'Adobe Analytics', mono: 'AA', c: '#5C2D91', what: D.baseWhat, sync: 'Connected during onboarding', badge: 'Connected', removable: false }]
      .concat(st.added.map(function (a, i) {
        return { name: a.name, mono: a.mono, c: a.c, what: a.what, sync: 'Synced just now', badge: a.badge, removable: true,
          remove: function () { var n = self.state.added.slice(); n.splice(i, 1); self.setState({ added: n }); } };
      }));

    var steps = [];
    if (run) {
      var csv = run.kind === 'csv', total = D.total;
      var S = csv
        ? [['Uploading file', 'Uploading ' + D.csv.file + '…', D.csv.file + ' · ' + D.csv.size],
           ['Mapping columns', 'Matching columns to ' + D.title.toLowerCase() + ' fields…', D.csv.mapped],
           ['Bringing in data', 'Reading ' + fmt(Math.round(total * run.pct / 100)) + ' of ' + fmt(total) + ' ' + D.unit, '']]
        : [['Checking access', 'Checking credentials…', 'Read-only access confirmed'],
           ['Connecting to ' + run.src.name, 'Opening a read-only connection…', run.src.linked],
           ['Bringing in data', 'Reading ' + fmt(Math.round(total * run.pct / 100)) + ' of ' + fmt(total) + ' ' + D.unit, '']];
      steps = S.map(function (s, i) {
        var done = run.stage > i, active = run.stage === i;
        return { label: s[0], detail: done ? s[2] : active ? s[1] : 'Waiting', isDone: done, isActive: active, isWait: !done && !active,
          fg: done || active ? 'var(--ink)' : 'var(--faint)', bt: i ? '1px solid var(--line)' : '0', hasBar: active && i === 2, pct: run.pct, pctW: run.pct + '%' };
      });
    }

    var picked = D.tiles.filter(function (t) { return t.name === st.pick; })[0];
    var addedNames = st.added.map(function (a) { return a.name; });
    function open() {
      self.setState({ addOpen: true });
      setTimeout(function () { var el = document.getElementById('addData'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30);
    }

    return {
      title: D.title, lede: D.lede, st: stx, vis: {
        segTitle: vis.segTitle, listTitle: vis.listTitle,
        segs: vis.segs.map(function (s, i) { return { l: s[0], w: s[1] + '%', c: RAMP[i % RAMP.length] }; }),
        list: vis.list.map(function (x) { return { name: x[0], n: fmt(x[1]), w: Math.max(2, x[1] / max * 100) + '%' }; })
      },
      stats: (full ? D.fullStats : D.baseStats).map(function (s) { return { n: fmt(s[0]), l: s[1], fg: s[0] === '—' ? 'var(--faint)' : 'var(--ink)' }; }),
      sources: sources,
      openAdd: open, addOpen: st.addOpen, addClosed: !st.addOpen, closeAdd: function () { if (!self.state.run) self.setState({ addOpen: false }); },
      modes: [['connect', 'Connect'], ['csv', 'Upload CSV'], ['mock', 'Mock data']].map(function (d) {
        var on = st.mode === d[0];
        return { label: d[1], sel: on ? 'true' : 'false', bg: on ? 'var(--surface)' : 'transparent', fg: on ? 'var(--ink)' : 'var(--ink-soft)', shadow: on ? '0 1px 2px rgba(0,0,0,0.05)' : 'none',
          pick: function () { if (!self.state.run) self.setState({ mode: d[0] }); } };
      }),
      isRunning: !!run, steps: steps,
      showConnect: !run && st.mode === 'connect', showCsv: !run && st.mode === 'csv', showMock: !run && st.mode === 'mock',
      tiles: D.tiles.map(function (t) {
        var sel = st.pick === t.name;
        return { name: t.name, kind: t.kind, mono: t.mono, c: t.c, adobe: !!t.adobe, on: addedNames.indexOf(t.name) >= 0, sel: sel ? 'true' : 'false',
          bd: sel ? '#18181b' : 'var(--line)', ring: sel ? '0 0 0 3px #f4f4f5' : 'none', pick: function () { self.setState({ pick: t.name }); } };
      }),
      noPick: !picked, pickedName: picked ? picked.name : '',
      oneClick: !!picked && !!picked.adobe, needsForm: !!picked && !picked.adobe,
      fields: picked ? picked.fields.map(function (f) { return { label: f[0], hint: f[1], ph: f[2], type: f[3] }; }) : [],
      startConnect: function () { self.run('connect', { name: picked.name, mono: picked.mono, c: picked.c, what: picked.kind, linked: picked.linked, badge: 'Connected' }); },
      csv: D.csv, startCsv: function () { self.run('csv', { name: 'CSV · ' + D.csv.file, mono: 'CSV', c: '#52525b', what: D.csv.mapped, badge: 'Imported' }); },
      mockInfo: D.mock, useMock: function () { self.setState({ addOpen: false, added: self.state.added.concat([{ name: 'Mock data', mono: 'M', c: '#3c8c81', what: 'Sephora · ' + D.title + ' pack · ' + D.mock, badge: 'Mock data' }]) }); },
      coverage: D.coverage.map(function (c) {
        var p = full ? c[2] : c[1], src = full && c[2] > c[1] ? addedName : (c[1] ? 'Adobe Analytics' : 'Missing');
        return { name: c[0], src: src, pct: p ? p + '%' : '—', w: p + '%', bar: p >= 90 ? '#3c8c81' : '#7fb8b0', fg: p ? 'var(--ink)' : 'var(--faint)' };
      }),
      sample: { title: D.sample.title, cols: D.sample.cols.map(function (t) { return { t: t }; }),
        rows: D.sample.rows.map(function (r) {
          return { cells: r.map(function (v, i) {
            var t = Array.isArray(v) ? (full ? v[1] : v[0]) : v;
            return { t: t, fg: t === '—' ? 'var(--faint)' : i ? 'var(--ink-soft)' : 'var(--ink)', w: i ? '400' : '600' };
          }) };
        }) }
    };
  }
}
</script>
</body>
</html>
