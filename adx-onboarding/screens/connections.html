<!-- Styles for this screen only (added while the screen is shown). Fonts are loaded once in index.html. -->
<style>

:root{--bg:#FAFAFA;--surface:#FFFFFF;--surface-2:#FAFAFA;--sink:#F4F4F5;--ink:#09090B;--ink-soft:#3F3F46;--muted:#71717A;--faint:#A1A1AA;--line:#E4E4E7;--line-strong:#D4D4D8;--accent:#18181B;--accent-soft:#F4F4F5;--accent-ink:#18181B;--ai:#3C8C81;--ai-soft:#EDF6F4;--ai-ink:#2F7A70;--good:#16A34A;--good-soft:#F0FDF4;--warn:#D97706;--warn-soft:#FFFBEB;--crit:#DC2626;--crit-soft:#FEF2F2;--ring:#18181B;--shadow:0 1px 2px 0 rgba(0,0,0,.05);--shadow-lg:0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1);--radius:10px;--radius-sm:8px;--rail:224px;--f-display:'Inter',system-ui,sans-serif;--f-body:'Inter',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;--an-c1:#2a78d6;--an-c2:#eb6834;--an-c3:#1baf7a;--an-c4:#eda100;--an-c5:#e87ba4;--an-c6:#008300;--ln-signal:#2a78d6;--ln-model:#1baf7a;--ln-trigger:#eb6834;--av-indigo-bg:#F0F1FF;--av-indigo-fg:#4C487C;--av-coral-bg:#FCEFEA;--av-coral-fg:#8F2B05;--av-teal-bg:#E3F6F0;--av-teal-fg:#005848;--av-sky-bg:#E6F5FF;--av-sky-fg:#105376;--v3cw:clamp(440px,32vw,640px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0px 15px; border-radius: var(--radius-sm); font-weight: 500; font-size: 13.5px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: background 0.12s, border-color 0.12s, box-shadow 0.12s, color 0.12s; white-space: nowrap; box-shadow: var(--shadow); }
.btn:hover { background: var(--sink); }
.btn:active { transform: translateY(0.5px); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-soft); box-shadow: none; }
.btn.ghost:hover { background: var(--sink); color: var(--ink); }
.btn.sm { height: 30px; padding: 0px 11px; font-size: 12.5px; border-radius: calc(var(--radius-sm) - 2px); }
.btn .ico { width: 15px; height: 15px; }
.pagehead { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
.pagehead .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
.pagehead h1 { font-size: 25px; line-height: 1.1; }
.pagehead p { margin: 7px 0px 0px; color: var(--muted); font-size: 13.5px; }
.dtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 4px 0px 22px; overflow-x: auto; }
.dtab { appearance: none; border-width: medium medium 2px; border-style: none none solid; border-color: currentcolor currentcolor transparent; border-image: none; background: none; font-style: inherit; font-variant: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 13.5px; font-weight: 500; color: var(--muted); white-space: nowrap; padding: 10px 15px; cursor: pointer; margin-bottom: -1px; transition: color 0.12s; }
.dtab:hover { color: var(--ink-soft); }
.dtab.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.dtab .tcount { font-size: 11px; font-weight: 600; color: var(--faint); margin-left: 6px; }
.rail .nav-cat-group, .rail .nav-sub { border-left-width: medium !important; border-left-style: none !important; border-left-color: currentcolor !important; margin-left: 0px !important; padding-left: 0px !important; }
.rail .subnav-item::before { display: none !important; }

.rail-setup { margin-top: auto; padding-top: 12px; }
.rail-setup + .rail-foot { margin-top: 10px; }
.setup-wrap { display: flex; flex-direction: column-reverse; background: rgb(24, 24, 27); border: 1px solid rgb(39, 39, 42); border-radius: 12px; padding: 4px; box-shadow: rgba(0, 0, 0, 0.45) 0px 6px 18px -8px; }
.setup-wrap .nav-cat { color: rgb(228, 228, 231); padding: 10px; border-radius: 9px; }
.setup-wrap .nav-cat:hover { color: rgb(255, 255, 255); background: rgb(39, 39, 42); }
.setup-wrap .nav-cat .nc-ico { display: grid; color: rgb(161, 161, 170); width: 18px; height: 18px; }
.setup-wrap .nav-cat .nc-ico svg { width: 15px; height: 15px; }
.setup-wrap .nav-cat .chev { color: rgb(113, 113, 122); transform: rotate(180deg); }
.setup-wrap .nav-cat-group { border-left-color: rgb(63, 63, 70); margin: 6px 0px 4px 18px; padding-left: 9px; }
.setup-wrap .subnav-item { color: rgb(161, 161, 170); }
.setup-wrap .subnav-item::before { background: rgb(63, 63, 70); }
.setup-wrap .subnav-item .sub-ico { color: rgb(113, 113, 122); }
.setup-wrap .subnav-item:hover { background: rgb(39, 39, 42); color: rgb(250, 250, 250); }
.setup-wrap .subnav-item.on { background: rgb(250, 250, 250); color: rgb(9, 9, 11); }
.setup-wrap .subnav-item.on .sub-ico { color: rgb(9, 9, 11); }
.setup-wrap .subnav-item.on::before { background: rgb(250, 250, 250); }
.ws-tabs { margin: 2px 0px 18px; }
.rail-foot .who { min-width: 0px; }
.rail-foot .who span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-cx { width: 34px; height: 34px; padding: 0px; justify-content: center; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; background: none; box-shadow: none; border-radius: 11px; }
.tb-cx svg { display: block; flex: 0 0 auto; transition: transform 0.12s; width: 30px !important; height: 30px !important; }
.tb-cx:hover svg { transform: scale(1.05); }
.wrap{max-width:1160px;margin:0 auto;padding:26px 22px 80px}
.wrap.full{max-width:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 15px;border-radius:var(--radius-sm);
font-weight:500;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
transition:background .12s,border-color .12s,box-shadow .12s,color .12s;white-space:nowrap;box-shadow:var(--shadow)}
.btn:hover{background:var(--sink)}
.btn:active{transform:translateY(.5px)}

display:flex;align-items:center;gap:6px;margin-bottom:7px}

/* ---- Connections ---- */
.cn-tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.cn-row{display:grid;grid-template-columns:minmax(220px,2.4fr) minmax(110px,1fr) 104px 120px 96px 150px;align-items:center;gap:14px;padding:13px 18px;border-top:1px solid var(--line);font-size:13.5px}
.cn-row.hd{border-top:0;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted);padding:10px 18px}
.cn-row.sub{background:var(--surface-2);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 18px;grid-template-columns:1fr}
.cn-src{display:flex;align-items:center;gap:12px;min-width:0}
.cn-lg{width:34px;height:34px;border-radius:9px;color:#fff;font-weight:800;font-size:11.5px;letter-spacing:-.02em;display:grid;place-items:center;flex:none}
.cn-src b{display:block;font-weight:600;font-size:13.5px}
.cn-src small{display:block;font-size:12px;color:var(--muted);margin-top:1px;line-height:1.35}
.cn-used{display:flex;flex-wrap:wrap;gap:4px}
.cn-used span{font-size:11.5px;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.cn-kind{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
.cn-kind i{width:6px;height:6px;border-radius:50%;display:block}
.cn-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid;white-space:nowrap}
.cn-pill i{width:6px;height:6px;border-radius:50%;display:block;background:currentColor}
.cn-muted{color:var(--muted);font-size:12.5px;white-space:nowrap}
.cn-act{display:flex;justify-content:flex-end;gap:6px}
.cn-panel{border-top:1px solid var(--line);background:var(--surface-2);padding:18px 18px 18px 64px;display:flex;flex-direction:column;gap:14px}
.cn-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px}
.cn-fields label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.cn-fields input{height:36px;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:0 11px;font-family:'Geist Mono',ui-monospace,monospace;font-size:12.5px;color:var(--ink);background:var(--surface)}
.cn-note{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.5;color:var(--muted)}
.cn-steps{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px 14px}
.cn-step{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.cn-step+.cn-step{border-top:1px solid var(--line)}
.cn-ic{flex:0 0 20px;height:20px;display:grid;place-items:center}
.cn-ok{width:20px;height:20px;border-radius:50%;background:#16a34a;color:#fff;display:grid;place-items:center}
.cn-spin{width:16px;height:16px;box-sizing:border-box;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--ink);animation:cnSpin .8s linear infinite}
.cn-wait{width:16px;height:16px;box-sizing:border-box;border-radius:50%;border:1.5px dashed var(--line-strong)}
@keyframes cnSpin{to{transform:rotate(360deg)}}
.cn-bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.cn-bar div{height:100%;border-radius:4px;background:linear-gradient(90deg,#18181b,#3c8c81)}
.cn-confirm{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid #fecaca;background:#fef2f2;border-radius:10px;padding:11px 14px;font-size:13px;color:var(--ink-soft)}
.btn.danger{background:#dc2626;color:#fff;border-color:transparent}
.btn.danger:hover{background:#dc2626;filter:brightness(1.06)}
@media(max-width:980px){.cn-row{grid-template-columns:1fr auto}.cn-row>:not(.cn-src):not(.cn-act){display:none}.cn-row.hd{display:none}.cn-panel{padding-left:18px}}


/* Shared app-shell fixes (keep in sync across home, setup, profiles, catalog, connections, web-signals, signals) */

<!-- Markup: Claude Design "DC" template syntax. See CLAUDE.md for the rules. -->
<template data-view>
<div style="display:flex;min-height:100vh;background:var(--bg);font-family:var(--f-body);color:var(--ink)">

<div class="pagehead"><div><div class="eyebrow">ADX Setup</div><h1>Connections</h1><p>Every system ADX reads from. Connections are read-only; disconnecting stops updates but keeps data already brought in.</p></div>
  <div class="side"><button class="btn primary" onClick="{{toAvail}}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add source</button></div></div>

<div class="cn-tbl">
  <div class="cn-row hd"><span>Source</span><span>Used for</span><span>Data</span><span>Status</span><span>Last data</span><span></span></div>
  <sc-for list="{{rows}}" as="r">
    <sc-if value="{{r.isSub}}"><div class="cn-row sub" id="{{r.anchor}}">{{r.label}}</div></sc-if>
    <sc-if value="{{r.isRow}}">
      <div class="cn-row">
        <div class="cn-src"><span class="cn-lg" style="background:{{r.c}}">{{r.mono}}</span><span style="min-width:0"><b>{{r.name}}<sc-if value="{{r.rec}}"><span class="cn-pill" style="margin-left:8px;color:#2f7a70;background:rgba(60,140,129,.1);border-color:rgba(60,140,129,.25);font-size:10.5px;padding:0 7px">Recommended</span></sc-if></b><small>{{r.desc}}</small></span></div>
        <div class="cn-used"><sc-for list="{{r.used}}" as="u"><span>{{u.l}}</span></sc-for></div>
        <span class="cn-kind"><i style="background:{{r.kindC}}"></i>{{r.kind}}</span>
        <span><span class="cn-pill" style="color:{{r.pfg}};background:{{r.pbg}};border-color:{{r.pbd}}"><i></i>{{r.status}}</span></span>
        <span class="cn-muted">{{r.last}}</span>
        <span class="cn-act">
          <sc-if value="{{r.canConnect}}"><button class="btn sm" onClick="{{r.connect}}">Connect</button></sc-if>
          <sc-if value="{{r.canEdit}}"><button class="btn sm ghost" onClick="{{r.edit}}">Edit</button><button class="btn sm" onClick="{{r.disc}}">Disconnect</button></sc-if>
        </span>
      </div>

      <sc-if value="{{r.showForm}}">
        <div class="cn-panel">
          <b style="font-size:13.5px">{{r.formTitle}}</b>
          <div class="cn-fields">
            <sc-for list="{{r.fields}}" as="f">
              <label>{{f.label}}<input type="{{f.type}}" value="{{f.val}}" placeholder="{{f.ph}}" onInput="{{f.set}}"></label>
            </sc-for>
          </div>
          <div class="cn-note"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></svg><span>{{r.note}}</span></div>
          <div style="display:flex;gap:8px"><button class="btn primary" onClick="{{r.go}}">{{r.goLabel}}</button><button class="btn ghost" onClick="{{r.close}}">Cancel</button></div>
        </div>
      </sc-if>

      <sc-if value="{{r.showSteps}}">
        <div class="cn-panel">
          <div class="cn-steps">
            <sc-for list="{{r.steps}}" as="s">
              <div class="cn-step">
                <span class="cn-ic"><sc-if value="{{s.done}}"><span class="cn-ok"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span></sc-if><sc-if value="{{s.active}}"><span class="cn-spin"></span></sc-if><sc-if value="{{s.wait}}"><span class="cn-wait"></span></sc-if></span>
                <span style="flex:1;min-width:0">
                  <span style="display:flex;gap:10px"><b style="flex:1;font-size:13px;font-weight:600;color:{{s.fg}}">{{s.label}}</b><sc-if value="{{s.bar}}"><span class="cn-muted" style="font-family:'Geist Mono',ui-monospace,monospace">{{s.pct}}%</span></sc-if></span>
                  <span class="cn-muted" style="display:block;white-space:normal;margin-top:2px">{{s.detail}}</span>
                  <sc-if value="{{s.bar}}"><div class="cn-bar"><div style="width:{{s.pctW}}"></div></div></sc-if>
                </span>
              </div>
            </sc-for>
          </div>
          <sc-if value="{{r.runDone}}"><div><button class="btn" onClick="{{r.close}}">Done</button></div></sc-if>
        </div>
      </sc-if>

      <sc-if value="{{r.showConfirm}}">
        <div class="cn-panel">
          <div class="cn-confirm"><span style="flex:1;min-width:240px"><b style="color:var(--ink)">Disconnect {{r.name}}?</b> {{r.discImpact}}</span>
            <button class="btn sm ghost" onClick="{{r.close}}">Cancel</button><button class="btn sm danger" onClick="{{r.confirmDisc}}">Disconnect</button></div>
        </div>
      </sc-if>
    </sc-if>
  </sc-for>
  <sc-if value="{{empty}}"><div class="cn-row" style="grid-template-columns:1fr;color:var(--muted)">Nothing here.</div></sc-if>
</div>
</div>
</div>
</div>
</template>
<script type="text/x-dc">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // st[id]: 'on' | 'off' | 'run'. open = { id, mode: 'form' | 'steps' | 'confirm' }. runs[id] = { stage 0-3, pct, edit }
    this.state = { st: { scan: 'on', websdk: 'on', aa: 'on', ajo: 'on', netomi: 'on', tealium: 'off', ga4: 'off', commerce: 'off', aem: 'off', zendesk: 'off', sfsc: 'off' },
      last: {}, open: null, runs: {}, vals: {} };
    this.timers = {};
  }
  componentWillUnmount() { for (var k in this.timers) clearInterval(this.timers[k]); }
  put(key, id, v) { var o = Object.assign({}, this.state[key]); if (v === null) delete o[id]; else o[id] = v; var p = {}; p[key] = o; this.setState(p); }
  run(id, edit) {
    var self = this, t0 = Date.now();
    this.put('st', id, 'run'); this.put('runs', id, { stage: 0, pct: 0, edit: edit }); this.setState({ open: { id: id, mode: 'steps' } });
    clearInterval(this.timers[id]);
    this.timers[id] = setInterval(function () {
      var ms = Date.now() - t0, stage = ms < 1300 ? 0 : ms < 2600 ? 1 : 2, pct = stage < 2 ? 0 : Math.min(100, Math.round((ms - 2600) / 30));
      if (pct >= 100) { clearInterval(self.timers[id]); self.put('runs', id, { stage: 3, pct: 100, edit: edit }); self.put('st', id, 'on'); self.put('last', id, 'Just now'); }
      else self.put('runs', id, { stage: stage, pct: pct, edit: edit });
    }, 120);
  }
  renderVals() {
    var self = this, st = this.state;
    var RT = ['Real-time', '#16a34a'], BATCH = ['Batch · daily', '#a1a1aa'], SCAN = ['Scan', '#71717a'], API = ['API', '#2563eb'];
    // [id, name, mono, color, desc, used for, data kind, last data, fields [label, placeholder, value, type], step details [checked, connected, brought in], recommended]
    var SRC = [
      ['scan', 'Website scan', 'W', '#27272a', 'Finds events on public pages and checks that they fire.', ['Web Signals', 'Content'], SCAN, 'Today, 08:12',
        [['Site URL', 'https://www.example.com', 'https://www.sephora.com', 'text'], ['Pages to scan', 'All public pages', 'All public pages', 'text']],
        ['sephora.com reachable · robots.txt allows scanning', 'Scheduled daily scan at 08:00', '3,400 pages indexed · 142 events found']],
      ['websdk', 'Adobe Web SDK', 'Ad', '#E2412E', 'Live storefront events from the Adobe Edge Network.', ['Web Signals'], RT, '2 min ago',
        [['Adobe org ID', 'A1B2C3D4E5F6@AdobeOrg', 'B7E41C2A9F0D@AdobeOrg', 'text'], ['Datastream ID', 'e.g. 3f2a9c71-…', '3f2a9c71-8d4e-4b0a-9e51-6c2d7a1f0b38', 'text'], ['Integration token', 'Paste your integration token', '••••••••••••', 'password']],
        ['Org ID and token accepted · read-only scope', 'Subscribed to datastream sephora-web-prod', '842K events from the last 14 days, now streaming live']],
      ['aa', 'Adobe Analytics', 'AA', '#5C2D91', 'Historical reports and segments.', ['Customer Profiles', 'Product Catalog'], BATCH, 'Today, 06:00',
        [['Adobe org ID', 'A1B2C3D4E5F6@AdobeOrg', 'B7E41C2A9F0D@AdobeOrg', 'text'], ['Report suite ID', 'sephoraglobal', 'sephoraglobal', 'text'], ['Integration token', 'Paste your integration token', '••••••••••••', 'password']],
        ['Org ID and token accepted · read-only scope', 'Linked to report suite sephoraglobal', '815K events · 71K visitor profiles · 18,962 products']],
      ['ajo', 'Adobe Journey Optimizer', 'A', '#E2412E', 'Journeys, experience events and audiences.', ['Web Signals'], RT, '5 min ago',
        [['Sandbox', 'prod', 'prod', 'text'], ['Integration token', 'Paste your integration token', '••••••••••••', 'password']],
        ['Sandbox prod found · read-only scope', 'Subscribed to journey and audience events', '31 journeys · 12 audiences']],
      ['netomi', 'Netomi', 'N', '#4F46E5', 'AI agents for recommendations, support and upsell.', ['Agents'], API, '1 min ago',
        [['Workspace ID', 'ws_…', 'ws_sephora_eu', 'text'], ['API key', 'Paste your API key', '••••••••••••', 'password']],
        ['Workspace found · API key valid', 'Agents linked to ADX experiences', '4 agents ready']],
      ['tealium', 'Tealium iQ', 'Tl', '#2C6BB3', 'Data layer events from your tag manager.', ['Web Signals'], RT, '',
        [['Account / profile', 'e.g. sephora/main', '', 'text'], ['EventStream URL', 'https://collect.tealiumiq.com/event', 'https://collect.tealiumiq.com/event', 'text'], ['API key', 'Paste your API key', '', 'password']],
        ['API key accepted for sephora/main · read-only scope', 'EventStream connector added for utag.js events', '861K events from the last 14 days, now streaming live']],
      ['ga4', 'Google Analytics 4', 'GA', '#E37400', 'GA4 events via the BigQuery export.', ['Web Signals', 'Customer Profiles'], BATCH, '',
        [['Measurement ID', 'e.g. G-7XK2Q9LM4P', '', 'text'], ['Service account key', 'Paste JSON key', '', 'password']],
        ['Service account accepted · Viewer role', 'Linked to the BigQuery export', '790K events from the last 14 days']],
      ['commerce', 'Adobe Commerce', 'Ac', '#E2412E', 'Products, prices, stock and categories.', ['Product Catalog'], ['Batch · hourly', '#a1a1aa'], '',
        [['Store URL', 'https://your-store.com', 'https://www.sephora.com', 'text'], ['Integration token', 'Paste your integration token', '', 'password']],
        ['Store found · read-only token accepted', 'Linked to the default store view', '21,384 products and variants · 94% with prices and stock'], 'Adds the prices and stock your catalog is missing'],
      ['aem', 'Adobe Experience Manager', 'AE', '#E2412E', 'Pages, assets and brand copy.', ['Content'], BATCH, '',
        [['Author URL', 'https://author-p123.adobeaemcloud.com', '', 'text'], ['Access token', 'Paste your access token', '', 'password']],
        ['Author instance found · read-only token accepted', 'Linked to sites and DAM', '3,400 content entries · 220 how-to guides']],
      ['zendesk', 'Zendesk', 'Z', '#03363D', 'Tickets, chats, CSAT and return reasons.', ['Customer Service'], API, '',
        [['Subdomain', 'your-store.zendesk.com', '', 'text'], ['API token', 'Paste your API token', '', 'password']],
        ['Subdomain found · read-only token accepted', 'Linked tickets to orders and shoppers', '48K tickets · 12 return reasons'], 'Next step in ADX Setup'],
      ['sfsc', 'Salesforce Service Cloud', 'SC', '#0B76D0', 'Cases and knowledge articles.', ['Customer Service'], API, '',
        [['Instance URL', 'https://your-org.my.salesforce.com', '', 'text'], ['Client ID', 'Connected app client ID', '', 'text'], ['Client secret', 'Paste your client secret', '', 'password']],
        ['Connected app accepted · read-only scope', 'Linked cases and knowledge articles', '52K cases · 640 articles']]
    ];
    var PILL = { on: ['Connected', '#15803d', '#f0fdf4', '#bbf7d0'], off: ['Not connected', '#52525b', '#f4f4f5', '#e4e4e7'], run: ['Connecting', '#1d4ed8', '#eff6ff', '#bfdbfe'] };
    var open = st.open;

    function row(s) {
      var id = s[0], status = st.st[id], o = open && open.id === id ? open.mode : null, run = st.runs[id], vals = st.vals[id] || {};
      var edit = o === 'form' && status === 'on', p = PILL[status];
      var stage = run ? run.stage : 0, pct = run ? run.pct : 0, ed = run && run.edit;
      var LBL = ed ? ['Checking access', 'Applying changes', 'Re-syncing data'] : ['Checking access', 'Connecting to ' + s[1], 'Bringing in data'];
      var ACT = ['Checking credentials…', 'Opening a read-only connection…', ed ? 'Re-reading the last 14 days…' : 'Reading the last 14 days…'];
      return {
        isRow: true, isSub: false, name: s[1], mono: s[2], c: s[3], desc: s[4], rec: status === 'off' && !!s[10],
        used: s[5].map(function (l) { return { l: l }; }), kind: s[6][0], kindC: s[6][1],
        status: p[0], pfg: p[1], pbg: p[2], pbd: p[3], last: status === 'off' ? '—' : status === 'run' ? 'Syncing…' : (st.last[id] || s[7]),
        canConnect: status === 'off', canEdit: status === 'on',
        connect: function () { self.setState({ open: { id: id, mode: 'form' } }); },
        edit: function () { self.setState({ open: o === 'form' ? null : { id: id, mode: 'form' } }); },
        disc: function () { self.setState({ open: o === 'confirm' ? null : { id: id, mode: 'confirm' } }); },
        close: function () { self.setState({ open: null }); },
        showForm: o === 'form', showSteps: o === 'steps' && !!run, showConfirm: o === 'confirm',
        formTitle: edit ? 'Edit ' + s[1] : 'Connect ' + s[1] + (s[10] ? ' · ' + s[10] : ''),
        note: edit ? 'Saving re-checks access and re-syncs. Leave the token as is to keep the current one.' : 'Read-only access. Credentials are encrypted; nothing changes in ' + s[1] + '.',
        goLabel: edit ? 'Save & re-check' : 'Connect',
        fields: s[8].map(function (f, i) {
          return { label: f[0], ph: f[1], type: f[3], val: vals[i] != null ? vals[i] : (status === 'off' && f[3] === 'password' ? '' : f[2]),
            set: function (ev) { var all = Object.assign({}, self.state.vals); all[id] = Object.assign({}, all[id]); all[id][i] = ev.target.value; self.setState({ vals: all }); } };
        }),
        go: function () { self.run(id, status === 'on'); },
        runDone: !!run && stage === 3,
        steps: LBL.map(function (l, i) {
          var done = stage > i, active = stage === i, bar = active && i === 2;
          return { label: l, done: done, active: active, wait: !done && !active, fg: done || active ? 'var(--ink)' : 'var(--faint)',
            detail: done ? s[9][i] : active ? ACT[i] : 'Waiting', bar: bar, pct: pct, pctW: pct + '%' };
        }),
        discImpact: s[5].join(' and ') + (s[5].length > 1 ? ' stop' : ' stops') + ' updating from it. Data already brought in is kept, and you can reconnect any time.',
        confirmDisc: function () { self.put('st', id, 'off'); self.put('runs', id, null); self.put('vals', id, null); self.setState({ open: null }); }
      };
    }
    var on = SRC.filter(function (s) { return st.st[s[0]] !== 'off'; }), off = SRC.filter(function (s) { return st.st[s[0]] === 'off'; });
    // recommended sources first among the available ones
    off.sort(function (a, b) { return (b[10] ? 1 : 0) - (a[10] ? 1 : 0); });
    var rows = [];
    if (on.length) { rows.push({ isSub: true, label: 'Connected · ' + on.length, anchor: 'cn-on' }); on.forEach(function (s) { rows.push(row(s)); }); }
    if (off.length) { rows.push({ isSub: true, label: 'Available to connect · ' + off.length, anchor: 'cn-avail' }); off.forEach(function (s) { rows.push(row(s)); }); }
    return {
      rows: rows, empty: rows.length === 0,
      toAvail: function () {
        var el = document.getElementById('cn-avail'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    };
  }
}
</script>
</body>
